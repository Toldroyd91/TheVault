<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COHI | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .luxury-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; border-radius: 8px; }
        .luxury-input:focus { outline: none; border-color: #0dcaf0; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <!-- GLOBAL NAV -->
    <nav class="flex justify-between items-center px-6 py-4 border-b border-gray-800 bg-gray-900/50">
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-xl font-black text-[#0dcaf0]">COHI<span class="text-white">COMMAND</span></a>
        </div>
        <div class="flex gap-4">
            <a href="survey.html" class="bg-[#0dcaf0] text-black px-4 py-2 rounded-lg font-bold text-xs hover:scale-105 transition">+ START NEW SURVEY</a>
            <button id="btnLogout" class="text-gray-400 hover:text-white text-xs">Logout</button>
        </div>
    </nav>

    <!-- DASHBOARD CONTENT -->
    <div id="dashboardApp" class="p-4 md:p-8">
        <header class="mb-8">
            <h1 id="designerWelcome" class="text-2xl md:text-3xl font-black mb-2">Welcome</h1>
            <input type="text" id="searchInput" placeholder="Search leads..." class="luxury-input p-3 w-full max-w-sm" onkeyup="window.filterLeads()">
        </header>

        <!-- KANBAN BOARD (Responsive) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 pb-8">
            <!-- Kanban Columns injected here via JS -->
        </div>
    </div>
    
    <script type="module" src="js/ui-dashboard.js"></script>
</body>
</html>
