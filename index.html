<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COHI Pro | Enterprise Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 
           DYNAMIC BRANDING ENGINE
           These variables are overwritten via JavaScript upon designer login, 
           instantly reskinning the entire application to the correct brand.
        */
        :root {
            --brand-primary: #0dcaf0; 
            --brand-bg-glow: rgba(13, 202, 240, 0.1);
            --brand-border: rgba(13, 202, 240, 0.3);
            
            --bg-base: #050505;
            --bg-panel: #0a0a0a;
            --bg-elevated: #111111;
            
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --border-subtle: #222222;
        }

        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* £1M Aesthetic Utility Classes */
        .glass-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: border-color 0.3s ease;
        }
        
        .luxury-input {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            border-radius: 8px;
            width: 100%;
            padding: 16px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }
        .luxury-input:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 1px var(--brand-primary);
        }

        .btn-primary {
            background: var(--brand-primary);
            color: #000;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            padding: 16px 24px;
            width: 100%;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn-primary:hover {
            filter: brightness(1.2);
            box-shadow: 0 8px 20px var(--brand-bg-glow);
            transform: translateY(-1px);
        }

        /* Sidebar Navigation */
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 8px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        .nav-link:hover {
            background: var(--bg-elevated);
            color: var(--text-main);
        }
        .nav-link.active {
            background: var(--brand-bg-glow);
            color: var(--brand-primary);
            border-color: var(--brand-border);
        }

        /* Auth Gate Animation */
        #authGate { transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="flex h-screen w-full">

    <!-- SECURE AUTH GATE -->
    <div id="authGate" class="fixed inset-0 z-[9999] flex items-center justify-center bg-[#050505] p-6 backdrop-blur-xl">
        <div class="glass-panel p-10 w-full max-w-md relative overflow-hidden">
            <!-- Dynamic Top Glow -->
            <div class="absolute top-0 left-0 w-full h-1" style="background: var(--brand-primary);"></div>
            
            <div class="text-center mb-10">
                <h1 class="text-3xl font-black tracking-widest mb-2" id="loginBrandTitle">COHI<span style="color: var(--brand-primary)">PRO</span></h1>
                <p class="text-xs text-gray-500 uppercase tracking-widest">Enterprise Authentication</p>
            </div>
            
            <div class="space-y-5">
                <input type="email" id="authEmail" placeholder="Designer Email" class="luxury-input text-center">
                <input type="password" id="authPassword" placeholder="••••••••" class="luxury-input text-center tracking-[0.5em]">
                <button id="btnLogin" class="btn-primary mt-4">Initialize Session</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP SHELL -->
    <div id="appShell" class="flex w-full h-full opacity-0 transition-opacity duration-700">
        
        <!-- GLOBAL SIDEBAR NAVIGATION -->
        <nav class="w-72 bg-[#0a0a0a] border-r border-[#222222] h-full flex flex-col z-50 flex-shrink-0">
            <div class="p-8 border-b border-[#222222]">
                <h2 class="text-xl font-black uppercase tracking-widest m-0" id="sidebarBrand">COHI<span style="color: var(--brand-primary)">PRO</span></h2>
                <div class="mt-4 flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-gray-700 to-gray-900 border border-gray-600 flex items-center justify-center text-xs font-bold" id="userInitial"></div>
                    <div>
                        <p class="text-sm font-bold text-white" id="userName">Loading...</p>
                        <p class="text-[10px] text-gray-500 uppercase tracking-widest">Lead Designer</p>
                    </div>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto py-6 px-4 space-y-2">
                <button class="nav-link active w-full text-left" onclick="switchModule('module-survey')">
                    <span class="text-lg">📐</span> Survey Engine
                </button>
                <button class="nav-link w-full text-left" onclick="switchModule('module-dossier')">
                    <span class="text-lg">🗂️</span> Dossier Compiler
                </button>
                <button class="nav-link w-full text-left" onclick="switchModule('module-gatekeeper')">
                    <span class="text-lg">🔒</span> Project Gatekeeper
                </button>
            </div>

            <div class="p-6 border-t border-[#222222]">
                <button id="btnLogout" class="w-full py-3 text-gray-500 hover:text-white text-xs font-bold uppercase tracking-widest transition">
                    Secure Logout
                </button>
            </div>
        </nav>

        <!-- DYNAMIC WORKSPACE -->
        <main class="flex-1 h-full overflow-y-auto bg-[#050505] relative">
            
            <!-- MODULE 1: THE RAPID SURVEY ENGINE -->
            <div id="module-survey" class="module-view p-10 max-w-5xl mx-auto h-full flex flex-col">
                
                <header class="mb-10 flex justify-between items-end">
                    <div>
                        <h1 class="text-4xl font-black uppercase tracking-tight mb-2">Rapid Site Survey</h1>
                        <p class="text-sm text-gray-500">Zero-friction data capture for advanced dossier generation.</p>
                    </div>
                    <button class="btn-primary w-auto text-xs px-6 py-3 shadow-[0_0_15px_var(--brand-bg-glow)]">
                        + New Project
                    </button>
                </header>

                <!-- Step 1: The Core Data (Preview of the new £1m layout) -->
                <div class="glass-panel p-8 mb-8">
                    <h3 class="text-xs uppercase font-bold tracking-widest mb-6 border-b border-[#222222] pb-4" style="color: var(--brand-primary)">01. Project Coordinates</h3>
                    
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-2">Lead Name *</label>
                            <input type="text" placeholder="e.g. Mr. Dall" class="luxury-input">
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-2">UK Postcode *</label>
                            <input type="text" placeholder="e.g. S70 0PN" class="luxury-input uppercase">
                            <p class="text-[9px] text-gray-500 mt-2">Required for automated Land Registry & EPC API scraping.</p>
                        </div>
                    </div>
                </div>

                <div class="glass-panel p-8">
                    <h3 class="text-xs uppercase font-bold tracking-widest mb-6 border-b border-[#222222] pb-4" style="color: var(--brand-primary)">02. Architectural Scope</h3>
                    
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-2">Roof System</label>
                            <select class="luxury-input appearance-none">
                                <option>Ultra380 Solid Roof</option>
                                <option>Edwardian Roof</option>
                                <option>Glass Conservatory Roof</option>
                                <option>Hybrid / Livin Roof</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-2">Proposed Footprint (mm)</label>
                            <input type="text" placeholder="e.g. 3000x4000" class="luxury-input">
                        </div>
                    </div>
                </div>

            </div>
            
        </main>
    </div>

    <!-- MOCK AUTH & BRANDING LOGIC FOR DEMONSTRATION -->
    <script>
        // Enterprise Brand Configurations
        const brands = {
            "Yorkshire Windows": { hex: "#005A9C", title: "YORKSHIRE" },
            "ClearView": { hex: "#238636", title: "CLEARVIEW" },
            "Orion": { hex: "#E50914", title: "ORION" },
            "Planet": { hex: "#8b5cf6", title: "PLANET" },
            "Trent Valley": { hex: "#f59e0b", title: "TRENT VALLEY" },
            "West Yorkshire": { hex: "#ec4899", title: "WEST YORKSHIRE" },
            "COHI": { hex: "#0dcaf0", title: "COHI" } // Default
        };

        // Simulate a Designer Login
        document.getElementById('btnLogin').addEventListener('click', () => {
            const btn = document.getElementById('btnLogin');
            btn.innerText = "Authenticating...";
            
            // In the real app, this waits for Firebase Auth to resolve, then reads the user's assigned brand from Firestore.
            setTimeout(() => {
                const mockDesignerBrand = "ClearView"; // Change this to test the dynamic theming!
                const mockDesignerName = "Thomas Oldroyd";
                
                applyBrandTheme(mockDesignerBrand);
                
                document.getElementById('userName').innerText = mockDesignerName;
                document.getElementById('userInitial').innerText = mockDesignerName.charAt(0);
                
                document.getElementById('authGate').classList.add('fade-out');
                setTimeout(() => {
                    document.getElementById('authGate').style.display = 'none';
                    document.getElementById('appShell').style.opacity = '1';
                }, 600);
            }, 800);
        });

        function applyBrandTheme(brandName) {
            const config = brands[brandName] || brands["COHI"];
            const root = document.documentElement;
            
            // Inject CSS Variables globally
            root.style.setProperty('--brand-primary', config.hex);
            
            // Calculate a subtle glow based on the hex
            const hexToRgb = (hex) => {
                const bigint = parseInt(hex.replace('#', ''), 16);
                return `${(bigint >> 16) & 255}, ${(bigint >> 8) & 255}, ${bigint & 255}`;
            };
            const rgb = hexToRgb(config.hex);
            
            root.style.setProperty('--brand-bg-glow', `rgba(${rgb}, 0.1)`);
            root.style.setProperty('--brand-border', `rgba(${rgb}, 0.3)`);
            
            // Update Text Logos
            document.getElementById('loginBrandTitle').innerHTML = `${config.title}<span style="color: var(--brand-primary)">PRO</span>`;
            document.getElementById('sidebarBrand').innerHTML = `${config.title}<span style="color: var(--brand-primary)">PRO</span>`;
        }

        window.switchModule = (moduleId) => {
            // Logic to handle transitioning between Survey, Dossier Compiler, etc.
            console.log("Switching to", moduleId);
        }
    </script>
</body>
</html>
