<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Pipeline | CO Home Improvements</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #f0f6fc; font-family: -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

        .glass-panel { background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(12px); border: 1px solid #30363d; }
        .kanban-col { min-height: 70vh; border-radius: 12px; padding: 16px; background: #090d13; border: 1px solid #30363d; display: flex; flex-direction: column; gap: 12px; }
        .lead-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; cursor: pointer; transition: all 0.2s ease; position: relative; overflow: hidden; }
        .lead-card:hover { border-color: #0dcaf0; transform: translateY(-2px); box-shadow: 0 4px 20px rgba(13, 202, 240, 0.15); }
        
        .status-indicator { position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
        .hot-lead { animation: pulseBorder 2s infinite; }
        @keyframes pulseBorder { 0% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(229, 9, 20, 0); } 100% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col h-screen overflow-hidden">

    <!-- TOP NAVIGATION -->
    <header class="glass-panel p-4 flex justify-between items-center z-10 sticky top-0 shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-[#090d13] rounded-xl border border-[#30363d] flex items-center justify-center text-[#0dcaf0] font-black text-xl shadow-[0_0_10px_rgba(13,202,240,0.2)]">CO</div>
            <div>
                <h1 class="text-xl font-black tracking-widest uppercase text-white">Master Pipeline</h1>
                <p class="text-[10px] text-gray-500 font-mono tracking-widest uppercase"><span class="inline-block w-2 h-2 bg-green-500 rounded-full mr-1 animate-pulse"></span> System Live</p>
            </div>
        </div>
        <div class="flex gap-4">
            <button onclick="window.location.href='survey.html'" class="px-6 py-2.5 bg-[#0dcaf0] text-black font-black uppercase tracking-widest text-xs rounded-lg hover:bg-cyan-400 transition shadow-[0_0_15px_rgba(13,202,240,0.3)] flex items-center gap-2">
                <span>+</span> New Survey
            </button>
        </div>
    </header>

    <!-- KANBAN BOARD -->
    <main class="flex-1 overflow-x-auto p-6 flex gap-6 items-start">
        
        <!-- COLUMN 1: Survey & Consultation -->
        <div class="kanban-col min-w-[320px] w-1/4">
            <div class="flex justify-between items-center mb-2 px-1">
                <h2 class="text-sm font-black text-gray-400 uppercase tracking-widest">1. Survey Stage</h2>
                <span id="count-stage1" class="text-xs bg-[#161b22] px-2 py-1 rounded text-gray-500 font-mono">0</span>
            </div>
            <div id="col-survey" class="flex flex-col gap-3 overflow-y-auto pr-1 pb-4 h-full">
                <!-- JS Injects Cards Here -->
            </div>
        </div>

        <!-- COLUMN 2: Design Tease (Locked Vault) -->
        <div class="kanban-col min-w-[320px] w-1/4 border-t-2 border-t-[#E50914]">
            <div class="flex justify-between items-center mb-2 px-1">
                <h2 class="text-sm font-black text-[#E50914] uppercase tracking-widest flex items-center gap-2"><span class="text-lg">🔒</span> 2. Design Tease</h2>
                <span id="count-stage2" class="text-xs bg-[#161b22] px-2 py-1 rounded text-[#E50914] font-mono border border-[#E50914]/30">0</span>
            </div>
            <div id="col-tease" class="flex flex-col gap-3 overflow-y-auto pr-1 pb-4 h-full">
                <!-- JS Injects Cards Here -->
            </div>
        </div>

        <!-- COLUMN 3: Proposal Unlocked (Live Meeting) -->
        <div class="kanban-col min-w-[320px] w-1/4 border-t-2 border-t-[#0dcaf0]">
            <div class="flex justify-between items-center mb-2 px-1">
                <h2 class="text-sm font-black text-[#0dcaf0] uppercase tracking-widest flex items-center gap-2"><span class="text-lg">🔓</span> 3. Price Unlocked</h2>
                <span id="count-stage3" class="text-xs bg-[#161b22] px-2 py-1 rounded text-[#0dcaf0] font-mono border border-[#0dcaf0]/30">0</span>
            </div>
            <div id="col-unlocked" class="flex flex-col gap-3 overflow-y-auto pr-1 pb-4 h-full">
                <!-- JS Injects Cards Here -->
            </div>
        </div>

        <!-- COLUMN 4: Closed Won -->
        <div class="kanban-col min-w-[320px] w-1/4 border-t-2 border-t-[#238636]">
            <div class="flex justify-between items-center mb-2 px-1">
                <h2 class="text-sm font-black text-[#238636] uppercase tracking-widest flex items-center gap-2"><span class="text-lg">🤝</span> 4. Closed Won</h2>
                <span id="count-stage4" class="text-xs bg-[#161b22] px-2 py-1 rounded text-[#238636] font-mono border border-[#238636]/30">0</span>
            </div>
            <div id="col-closed" class="flex flex-col gap-3 overflow-y-auto pr-1 pb-4 h-full">
                <!-- JS Injects Cards Here -->
            </div>
        </div>

    </main>

    <script type="module">
        import { db, collection, onSnapshot, query, orderBy } from './js/core-firebase.js';

        // Helper to format telemetry data into human-readable strings
        function formatTimeAgo(timestamp) {
            if (!timestamp) return 'Never';
            const seconds = Math.floor((new Date() - timestamp) / 1000);
            if (seconds < 60) return 'Just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            return `${Math.floor(hours / 24)}d ago`;
        }

        function formatViewTime(seconds) {
            if (!seconds) return '0m';
            if (seconds < 60) return '< 1m';
            const m = Math.floor(seconds / 60);
            if (m > 60) return `${Math.floor(m/60)}h ${m%60}m`;
            return `${m}m`;
        }

        // Generate Lead Card HTML
        function createLeadCard(id, data, columnColor) {
            const name = data.customerProfile?.leadName || 'Unnamed Lead';
            const postcode = data.customerProfile?.postcode || 'Location TBC';
            const viewTime = data.vaultTelemetry?.totalViewTimeSeconds || 0;
            const lastActive = data.vaultTelemetry?.lastActive;
            const price = data.uDesignData?.totalPrice ? `£${parseFloat(data.uDesignData.totalPrice).toLocaleString()}` : 'TBC';
            
            // Highlight hot leads (looked at vault for more than 5 minutes recently)
            const isHot = viewTime > 300 && lastActive && (Date.now() - lastActive < 86400000 * 2); // Active in last 48 hrs

            return `
                <div class="lead-card ${isHot ? 'hot-lead border-[#E50914]' : ''}" onclick="window.open('admin-gatekeeper.html?id=${id}', '_blank')">
                    <div class="status-indicator bg-[${columnColor}]"></div>
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-bold text-white text-sm">${name}</h3>
                            <p class="text-[10px] text-gray-500 uppercase tracking-widest">${postcode}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold ${data.uDesignData?.totalPrice ? 'text-[#0dcaf0]' : 'text-gray-600'}">${price}</span>
                        </div>
                    </div>
                    
                    <div class="border-t border-[#30363d] pt-3 mt-1 flex justify-between items-center bg-[#090d13] -mx-4 -mb-4 px-4 py-2 rounded-b-lg">
                        <div class="flex gap-4">
                            <div title="Total Viewing Time">
                                <span class="text-[10px] text-gray-500 uppercase tracking-widest block leading-tight">Interest</span>
                                <span class="text-xs font-mono font-bold ${viewTime > 300 ? 'text-[#E50914]' : 'text-gray-400'}">👁️ ${formatViewTime(viewTime)}</span>
                            </div>
                            <div title="Last Active">
                                <span class="text-[10px] text-gray-500 uppercase tracking-widest block leading-tight">Last Seen</span>
                                <span class="text-xs font-mono text-gray-400">🕒 ${formatTimeAgo(lastActive)}</span>
                            </div>
                        </div>
                        <div class="text-[10px] bg-[#161b22] px-2 py-1 rounded border border-[#30363d] uppercase tracking-widest">
                            Gatekeeper ↗
                        </div>
                    </div>
                </div>
            `;
        }

        // Listen to all surveys
        const q = query(collection(db, "surveys"), orderBy("timestamps.createdAt", "desc"));
        
        onSnapshot(q, (snapshot) => {
            const cols = { survey: '', tease: '', unlocked: '', closed: '' };
            const counts = { survey: 0, tease: 0, unlocked: 0, closed: 0 };

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                
                const access = data.vaultAccessLevel || 'survey_only';
                const status = data.pipelineStatus || '';

                // Routing Logic
                if (status === 'Closed Won' || status === '4. Handover') {
                    cols.closed += createLeadCard(id, data, '#238636');
                    counts.closed++;
                } else if (access === 'full_access') {
                    cols.unlocked += createLeadCard(id, data, '#0dcaf0');
                    counts.unlocked++;
                } else if (access === 'design_tease') {
                    cols.tease += createLeadCard(id, data, '#E50914');
                    counts.tease++;
                } else {
                    cols.survey += createLeadCard(id, data, '#4b5563');
                    counts.survey++;
                }
            });

            // Inject DOM
            document.getElementById('col-survey').innerHTML = cols.survey || '<div class="text-xs text-gray-600 text-center mt-4 italic">No leads in this stage.</div>';
            document.getElementById('col-tease').innerHTML = cols.tease || '<div class="text-xs text-gray-600 text-center mt-4 italic">No leads in this stage.</div>';
            document.getElementById('col-unlocked').innerHTML = cols.unlocked || '<div class="text-xs text-gray-600 text-center mt-4 italic">No leads in this stage.</div>';
            document.getElementById('col-closed').innerHTML = cols.closed || '<div class="text-xs text-gray-600 text-center mt-4 italic">No leads in this stage.</div>';

            document.getElementById('count-stage1').innerText = counts.survey;
            document.getElementById('count-stage2').innerText = counts.tease;
            document.getElementById('count-stage3').innerText = counts.unlocked;
            document.getElementById('count-stage4').innerText = counts.closed;
        });
    </script>
</body>
</html>
