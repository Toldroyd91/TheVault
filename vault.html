<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Project Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background: #0d1117; color: #f0f6fc; }
        .glass-panel { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .luxury-input { background: #090d13; border: 1px solid #30363d; color: white; border-radius: 8px; width: 100%; p-4 }
    </style>
</head>
<body class="min-h-screen">
    
    <!-- GLOBAL NAV -->
    <nav class="flex justify-between items-center px-6 py-4 border-b border-[#30363d] bg-[#161b22]">
        <a href="index.html" class="text-sm font-bold text-gray-400 hover:text-white">← BACK TO HOME</a>
        <div class="font-black text-[#0dcaf0]">SECURE VAULT</div>
    </nav>

    <div id="loginGate" class="max-w-md mx-auto mt-20 glass-panel p-8 text-center">
        <h2 class="text-xl font-bold mb-6">PROJECT AUTHENTICATION</h2>
        <input type="password" id="vaultPinInput" placeholder="ENTER PIN" class="luxury-input p-4 mb-4 text-center">
        <button onclick="window.unlockVault()" id="btnAccess" class="w-full py-3 bg-[#0dcaf0] text-black font-bold rounded-lg">DECRYPT</button>
    </div>

    <!-- VAULT CONTENT (Responsive) -->
    <div id="vaultContent" class="hidden p-4 md:p-8 space-y-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div id="dynamicSurveyData" class="lg:col-span-2 glass-panel p-6"></div>
            <div id="chat-window" class="glass-panel p-6 h-96 flex flex-col"></div>
        </div>
        <button onclick="window.downloadSurveyReport()" class="w-full py-4 bg-green-600 font-bold rounded-xl">DOWNLOAD MASTER SITE REPORT</button>
    </div>

    <script type="module" src="js/ui-vault.js"></script>
</body>
</html>
