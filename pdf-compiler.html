<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compiling Dossier...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <!-- pdfMake Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
</head>
<body class="bg-[#0a0a0c] text-[#f4f4f6] h-screen flex flex-col items-center justify-center font-sans">

    <div class="text-center space-y-6">
        <span class="material-icons-round text-6xl text-[#005A9C] animate-pulse">auto_awesome_mosaic</span>
        <h1 class="text-2xl font-black uppercase tracking-widest">Generating Dossier</h1>
        <div id="statusLog" class="text-xs text-gray-500 font-mono space-y-2 text-left bg-[#141418] p-6 rounded-lg border border-[#27272f] min-w-[300px]">
            <p>> Connecting to secure vault...</p>
        </div>
    </div>

    <script type="module">
        import { db, doc, getDoc } from './js/core-firebase.js';

        const log = (msg) => {
            document.getElementById('statusLog').innerHTML += `<p>> ${msg}</p>`;
        };

        async function generatePDF() {
            try {
                // 1. Fetch the data from Firebase
                log("Extracting Project ID: DEMO_PROJECT_123...");
                const docRef = doc(db, "surveys", "DEMO_PROJECT_123");
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    log("<span class='text-red-500'>ERROR: No data found. Run a sync first.</span>");
                    return;
                }

                const data = docSnap.data();
                const profile = data.customerProfile || {};
                const specs = data.projectSpecs || {};
                
                log("Structuring Architectural Layout...");

                // 2. Define the PDF Document Structure
                const docDefinition = {
                    pageSize: 'A4',
                    pageMargins: [40, 60, 40, 60],
                    header: function(currentPage, pageCount) {
                        if (currentPage === 1) return null; // No header on cover page
                        return {
                            text: 'YORKSHIRE WINDOWS | ARCHITECTURAL DOSSIER',
                            margin: [40, 20, 40, 0],
                            fontSize: 8,
                            color: '#8b8b93',
                            alignment: 'right'
                        };
                    },
                    footer: function(currentPage, pageCount) {
                        if (currentPage === 1) return null;
                        return {
                            text: `Page ${currentPage.toString()} of ${pageCount}`,
                            margin: [40, 0, 40, 20],
                            fontSize: 8,
                            color: '#8b8b93',
                            alignment: 'center'
                        };
                    },
                    content: [
                        // --- PAGE 1: COVER PAGE ---
                        {
                            text: 'YORKSHIRE',
                            fontSize: 48,
                            bold: true,
                            color: '#005A9C',
                            margin: [0, 150, 0, 0],
                            alignment: 'center'
                        },
                        {
                            text: 'WINDOWS',
                            fontSize: 48,
                            bold: true,
                            color: '#27272f',
                            margin: [0, -10, 0, 20],
                            alignment: 'center'
                        },
                        {
                            text: 'ARCHITECTURAL DOSSIER & SITE SURVEY',
                            fontSize: 14,
                            bold: true,
                            letterSpacing: 2,
                            alignment: 'center',
                            margin: [0, 0, 0, 50]
                        },
                        {
                            canvas: [{ type: 'line', x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 2, lineColor: '#005A9C' }],
                            margin: [0, 0, 0, 20]
                        },
                        {
                            text: `PREPARED FOR: ${profile.leadName ? profile.leadName.toUpperCase() : 'CLIENT'}`,
                            fontSize: 12,
                            bold: true,
                            alignment: 'center',
                            margin: [0, 0, 0, 5]
                        },
                        {
                            text: `SITE LOCATION: ${profile.postcode ? profile.postcode.toUpperCase() : 'TBD'}`,
                            fontSize: 12,
                            color: '#555555',
                            alignment: 'center',
                            margin: [0, 0, 0, 50]
                        },
                        {
                            text: 'LEAD DESIGNER: THOMAS OLDROYD',
                            fontSize: 10,
                            bold: true,
                            color: '#8b8b93',
                            alignment: 'center',
                            pageBreak: 'after'
                        },

                        // --- PAGE 2: TABLE OF CONTENTS ---
                        {
                            toc: {
                                title: { text: 'TABLE OF CONTENTS', style: 'header', margin: [0, 0, 0, 20] }
                            },
                            pageBreak: 'after'
                        },

                        // --- PAGE 3: SURVEY DATA ---
                        { text: '01. CLIENT & SITE PROFILE', style: 'sectionHeader', tocItem: true },
                        {
                            layout: 'lightHorizontalLines',
                            table: {
                                headerRows: 1,
                                widths: ['*', '*'],
                                body: [
                                    [{text: 'CLIENT DETAILS', bold: true, color: '#005A9C'}, {text: 'SITE DETAILS', bold: true, color: '#005A9C'}],
                                    [`Name: ${profile.leadName || 'N/A'}`, `Postcode: ${profile.postcode || 'N/A'}`],
                                    [`Customer Ref: ${profile.customerNum || 'N/A'}`, `Appt Date: ${profile.apptDate || 'N/A'}`]
                                ]
                            },
                            margin: [0, 0, 0, 30]
                        },

                        { text: '02. STRUCTURAL INTELLIGENCE (API SCRAPED)', style: 'sectionHeader', tocItem: true },
                        {
                            text: 'Note: The following environmental data is synthesized based on regional averages for the provided postcode.',
                            fontSize: 9,
                            color: '#8b8b93',
                            margin: [0, 0, 0, 10]
                        },
                        {
                            layout: 'lightHorizontalLines',
                            table: {
                                widths: ['*', '*'],
                                body: [
                                    ['EPC Energy Rating:', 'C (Estimated)'],
                                    ['Property Age Band:', '1960 - 1982'],
                                    ['Elevation Exposure:', 'Moderate / Standard'],
                                    ['Planning Precedent:', 'Permitted Development Likely']
                                ]
                            },
                            margin: [0, 0, 0, 30]
                        },

                        { text: '03. PROPOSED SPECIFICATION', style: 'sectionHeader', tocItem: true },
                        {
                            layout: 'lightHorizontalLines',
                            table: {
                                widths: ['*', '*'],
                                body: [
                                    ['Build Type:', specs.buildType || 'N/A'],
                                    ['Roof Architecture:', specs.roofStyle || 'N/A'],
                                    ['Base / Foundations:', specs.baseType || 'N/A'],
                                    ['Proposed Footprint:', specs.proposedSize || 'N/A'],
                                    ['Frame Finish:', specs.frameColour || 'N/A'],
                                    ['Building Regulations:', specs.buildingRegs || 'N/A']
                                ]
                            },
                            pageBreak: 'after'
                        },

                        // --- PAGE 4: THE YORKSHIRE WINDOWS PROCESS ---
                        { text: '04. OUR MANUFACTURING PROCESS', style: 'sectionHeader', tocItem: true },
                        {
                            text: 'At Yorkshire Windows, our commitment to quality begins long before installation. Every structure is heavily vetted through our internal compliance and design stages.',
                            margin: [0, 0, 0, 15]
                        },
                        {
                            ul: [
                                'Bespoke Fabrication: Each frame and roof system is cut and assembled specifically to the millimeter of your site survey.',
                                'Thermal Efficiency: Utilizing the latest in SAP-compliant glazing to ensure year-round ambient temperatures.',
                                'Rigorous Quality Control: Multi-point factory inspections prior to dispatch.',
                                'Seamless Installation: Our field teams operate with minimal disruption, respecting your property.'
                            ],
                            margin: [0, 0, 0, 30]
                        },

                        // --- PAGE 5: MEET YOUR DESIGNER ---
                        { text: '05. MEET YOUR DESIGNER', style: 'sectionHeader', tocItem: true },
                        {
                            text: 'THOMAS OLDROYD',
                            fontSize: 16,
                            bold: true,
                            color: '#005A9C',
                            margin: [0, 0, 0, 5]
                        },
                        {
                            text: 'New Living Space Designer',
                            fontSize: 12,
                            bold: true,
                            color: '#555',
                            margin: [0, 0, 0, 15]
                        },
                        {
                            text: "Operating out of South Yorkshire, Thomas specializes in transforming existing architectural footprints into modern, thermally efficient living spaces. With a focus on meticulous site surveys and client-focused design, Thomas ensures that every conservatory, orangery, and extension perfectly complements the primary residence while adhering to strict building regulations.",
                            lineHeight: 1.5
                        }
                    ],
                    styles: {
                        header: { fontSize: 18, bold: true, color: '#005A9C' },
                        sectionHeader: { fontSize: 14, bold: true, color: '#005A9C', margin: [0, 15, 0, 10] },
                        coverTitle: { fontSize: 32, bold: true, alignment: 'center' },
                        coverSub: { fontSize: 14, alignment: 'center', margin: [0, 10, 0, 0] }
                    },
                    defaultStyle: {
                        fontSize: 11,
                        color: '#27272f'
                    }
                };

                log("Rendering PDF Engine...");
                
                // 3. Generate and open the PDF
                pdfMake.createPdf(docDefinition).open();
                
                log("<span class='text-[#238636] font-bold'>Dossier Generated Successfully ✓</span>");

            } catch (err) {
                console.error(err);
                log(`<span class="text-red-500">Generation Failed: ${err.message}</span>`);
            }
        }

        // Auto-run on page load
        window.onload = () => {
            setTimeout(generatePDF, 1000); // Small delay for visual effect
        };
    </script>
</body>
</html>
