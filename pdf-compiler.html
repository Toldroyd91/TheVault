<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Survey Compiler</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <script>
        window.addEventListener('error', function(e) {
            const list = document.getElementById('surveyList');
            const overlay = document.getElementById('loadingOverlay');
            if(overlay) overlay.style.display = 'none';
            if(list) {
                list.style.display = 'block';
                list.innerHTML = `<div style="background: #b20710; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                    <h3 style="margin-top:0; color: #fff;">CRITICAL SYSTEM CRASH</h3>
                    <p style="font-weight: bold;">Error: ${e.message}</p>
                    <p style="font-size: 11px; opacity: 0.8;">File: ${e.filename} <br>Line: ${e.lineno}</p>
                    <p style="font-size: 12px; margin-top: 15px;">Please screenshot this and send it to your developer.</p>
                </div>`;
            }
        });
    </script>

    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #0dcaf0; --text: #c9d1d9; --border: #30363d; --success: #238636; --warn: #f59e0b; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 20px; }
        
        .compiler-dashboard { max-width: 800px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
        h1 { color: #fff; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        
        .survey-card { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #0d1117; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
        .survey-info h3 { margin: 0 0 5px 0; color: #fff; font-size: 16px; }
        .survey-info p { margin: 0; color: #8b949e; font-size: 13px; }
        
        .compile-btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .compile-btn:hover { opacity: 0.9; transform: scale(1.02); }
        .compile-btn:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; transform: none; }

        /* A4 PDF PRINT STYLES - Hiding from standard web view */
        #pdf-engine { display: none; background: white; width: 210mm; margin: 0 auto; }
        .pdf-page { width: 210mm; min-height: 297mm; background: white; color: #000; position: relative; box-sizing: border-box; padding: 15mm; page-break-after: always; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .pdf-watermark { position: absolute; top: 15mm; right: 15mm; font-size: 12px; font-weight: bold; color: #cbd5e1; text-transform: uppercase; letter-spacing: 2px; }
        .pdf-header { border-bottom: 2px solid #0dcaf0; padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: flex-end; }
        .pdf-title { margin: 0; font-size: 24px; color: #0f172a; text-transform: uppercase; letter-spacing: 1px; }
        .pdf-subtitle { font-size: 12px; color: #64748b; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
        
        .pdf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .pdf-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 15px; }
        .pdf-box.full-width { grid-column: 1 / -1; }
        .pdf-box.highlight { background: #f0f9ff; border-color: #bae6fd; }
        
        .pdf-label { display: block; font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: bold; margin-bottom: 8px; letter-spacing: 0.5px; }
        .pdf-val { margin: 0; font-size: 18px; font-weight: bold; color: #0f172a; }
        .pdf-desc { margin: 5px 0 0 0; font-size: 13px; color: #334155; line-height: 1.4; }
        .pdf-math { margin-top: 10px; font-size: 11px; font-family: monospace; color: #0284c7; background: #e0f2fe; padding: 6px; border-radius: 4px; }
        
        .section-title { font-size: 14px; font-weight: bold; color: #0f172a; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; margin-bottom: 15px; margin-top: 30px; }
        .pdf-citation { margin-top: 40px; font-size: 10px; color: #94a3b8; line-height: 1.5; border-top: 1px solid #e2e8f0; padding-top: 10px; }
    </style>
</head>
<body>

    <div class="compiler-dashboard">
        <h1>Master PDF Engine</h1>
        <p>Select a survey to compile the final client feasibility report.</p>
        <div id="surveyList">Loading recorded surveys...</div>
    </div>

    <div id="pdf-engine">
        <div id="pdf-content"></div>
    </div>

    <script type="module">
        import { auth, db, collection, getDocs, doc, getDoc, onAuthStateChanged, functions } from './js/core-firebase.js';
        import { httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

        const brandName = "Yorkshire Windows / COHI";

        // Load Surveys on Auth
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                loadSurveys();
            } else {
                document.getElementById('surveyList').innerHTML = "Authentication required.";
            }
        });

        async function loadSurveys() {
            const list = document.getElementById('surveyList');
            try {
                const querySnapshot = await getDocs(collection(db, "surveys"));
                let html = '';
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const name = data.customerProfile?.leadName || 'Unnamed Client';
                    const pc = data.customerProfile?.postcode || 'No Postcode';
                    
                    html += `
                        <div class="survey-card">
                            <div class="survey-info">
                                <h3>${name}</h3>
                                <p>${pc} | Ref: ${doc.id.substring(0,6)}</p>
                            </div>
                            <button class="compile-btn" onclick="window.compileReport('${doc.id}', this)">Generate PDF</button>
                        </div>
                    `;
                });
                
                list.innerHTML = html || "<p>No surveys found in database.</p>";
            } catch (err) {
                list.innerHTML = `<p style="color:#ef4444;">Database Error: ${err.message}</p>`;
            }
        }

        // Expose function to global window so the button onclick can reach it
        window.compileReport = async (surveyId, btnElement) => {
            const originalText = btnElement.innerText;
            btnElement.innerText = "Extracting Data...";
            btnElement.disabled = true;

            try {
                // 1. FETCH FIRESTORE DATA
                const docRef = doc(db, "surveys", surveyId);
                const docSnap = await docRef.get();
                if (!docSnap.exists()) throw new Error("Survey document missing.");
                const data = docSnap.data();

                const postcode = data.customerProfile?.postcode || "";
                // SMART EXTRACTOR: Tries to find a dedicated house number, or rips the first word from Address Line 1
                const rawAddress = data.customerProfile?.addressLine1 || "";
                const houseNum = data.customerProfile?.houseNumber || rawAddress.split(' ')[0] || "1";

                // --- 2. METEOROLOGICAL, EPC & OS MAP API DATA ---
                let elevation = "Pending API";
                let epcData = { area: "TBC", rating: "TBC", walls: "Unrecorded", roof: "Unrecorded" };
                let osMapUrl = "";
                let lat = 0, lng = 0;
                
                // Valuation Math Constants
                const valSqm = 2600; // Regional value per sqm
                const sizeMatch = data.uDesignBridge?.projectDetails?.match(/Size:\s*(\d+)x(\d+)/i);
                let sqMetres = 0;
                if(sizeMatch) sqMetres = ((parseInt(sizeMatch[1])/1000) * (parseInt(sizeMatch[2])/1000)).toFixed(1);

                if(postcode) {
                    try {
                        btnElement.innerText = "Querying Gov Secure APIs...";
                        const cleanPC = postcode.replace(/\s+/g, '');
                        
                        // Convert Postcode to Lat/Lng
                        const pcRes = await fetch(`https://api.postcodes.io/postcodes/${cleanPC}`);
                        const pcData = await pcRes.json();
                        
                        if(pcData.status === 200) {
                            lat = pcData.result.latitude;
                            lng = pcData.result.longitude;
                            
                            // Open-Meteo Elevation
                            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true&elevation=true`);
                            const weatherData = await weatherRes.json();
                            elevation = `${weatherData.elevation}`;

                            // SECURE EPC CLOUD CALL
                            const fetchEPC = httpsCallable(functions, 'fetchEPCData');
                            const epcRes = await fetchEPC({ postcode: cleanPC, houseNum: houseNum });
                            if(epcRes.data && epcRes.data.success && epcRes.data.data) {
                                epcData.area = `${epcRes.data.data['total-floor-area']} m²`;
                                epcData.rating = epcRes.data.data['current-energy-rating']?.toUpperCase() || "TBC";
                                epcData.walls = epcRes.data.data['walls-description'] || "Unrecorded";
                                epcData.roof = epcRes.data.data['roof-description'] || "Unrecorded";
                            }

                            // SECURE OS MAP CLOUD CALL
                            const fetchOS = httpsCallable(functions, 'fetchOSMap');
                            const osRes = await fetchOS({ lat: lat, lng: lng });
                            if(osRes.data && osRes.data.url) {
                                osMapUrl = osRes.data.url;
                            }
                        }
                    } catch(e) { console.warn("Background API Fetch failed:", e); }
                }

                // 3. COMPILE HTML FOR PDF
                btnElement.innerText = "Rendering Layout...";
                let html = '';

                // PAGE 1: PROJECT OVERVIEW
                html += `
                <div class="pdf-page">
                    <div class="pdf-watermark">${brandName}</div>
                    <div class="pdf-header">
                        <div><div class="pdf-subtitle">SECTION 00</div><h1 class="pdf-title">PROJECT SPECIFICATION</h1></div>
                        <div style="text-align: right;">
                            <p style="margin:0; font-weight:bold; font-size:14px;">${data.customerProfile?.leadName || 'Client'}</p>
                            <p style="margin:0; color:#64748b; font-size:12px;">${postcode}</p>
                        </div>
                    </div>
                    
                    <div class="section-title">Client Requirements & Scope</div>
                    <div style="font-size: 14px; line-height: 1.6; color: #334155; margin-bottom: 30px;">
                        ${data.aiPolishedNotes || data.salesNotes || "No project description recorded."}
                    </div>

                    <div class="pdf-grid">
                        <div class="pdf-box">
                            <span class="pdf-label">Requested Layout</span>
                            <p class="pdf-val">${data.uDesignBridge?.projectDetails || 'Custom Configuration'}</p>
                        </div>
                        <div class="pdf-box">
                            <span class="pdf-label">Survey Date</span>
                            <p class="pdf-val">${new Date().toLocaleDateString('en-GB')}</p>
                        </div>
                    </div>
                </div>
                `;

                // PAGE 2: INTELLIGENCE & EQUITY DATA
                let upliftVal = sqMetres > 0 ? `£${(sqMetres * valSqm).toLocaleString()}` : "Pending Dimensions";
                
                html += `
                <div class="pdf-page">
                    <div class="pdf-watermark">${brandName}</div>
                    <div class="pdf-header">
                        <div><div class="pdf-subtitle">SECTION 01</div><h1 class="pdf-title">SITE INTELLIGENCE</h1></div>
                    </div>

                    <div class="section-title">1.1 Existing Property Intel (UK Gov EPC Database)</div>
                    <div class="pdf-grid" style="margin-bottom: 15px;">
                        <div class="pdf-box"><span class="pdf-label">Registered Internal Area</span><p class="pdf-val">${epcData.area}</p></div>
                        <div class="pdf-box"><span class="pdf-label">Energy Efficiency</span><p class="pdf-val" style="color:#238636;">Band ${epcData.rating}</p></div>
                        <div class="pdf-box full-width">
                            <span class="pdf-label">Existing Envelope Construction</span>
                            <p class="pdf-desc" style="font-size:12px;"><strong>Walls:</strong> ${epcData.walls} <br><strong>Roof:</strong> ${epcData.roof}</p>
                        </div>
                    </div>

                    <div class="section-title">1.2 Projected Valuation Metrics</div>
                    <div class="pdf-grid" style="margin-bottom: 15px;">
                        <div class="pdf-box highlight">
                            <span class="pdf-label">Proposed Addition SQM</span>
                            <p class="pdf-val">${sqMetres > 0 ? sqMetres + ' m²' : 'TBC'}</p>
                        </div>
                        <div class="pdf-box highlight">
                            <span class="pdf-label">Estimated Equity Uplift</span>
                            <p class="pdf-val" style="color:#0369a1;">${upliftVal}</p>
                            <p class="pdf-desc" style="font-size:10px;">Regional benchmark projection.</p>
                        </div>
                    </div>

                    <div class="section-title">1.3 Topographical Boundary Context</div>
                    <div class="pdf-grid">
                        <div class="pdf-box">
                            <span class="pdf-label">Elevation & Load Exposure</span>
                            <p class="pdf-val">${elevation}m ASL</p>
                            <p class="pdf-desc">Review structural ties if elevation exceeds 150m standard limits.</p>
                        </div>
                        <div class="pdf-box" style="padding: 0; overflow: hidden; position: relative;">
                            <span class="pdf-label" style="position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.95); padding: 4px 8px; border: 1px solid #ccc; z-index: 10;">OS RASTER MAP</span>
                            ${osMapUrl ? `<img src="${osMapUrl}" style="width: 100%; height: 160px; object-fit: cover;">` : '<div style="padding: 40px; text-align:center; color:#94a3b8;">Ordnance Survey Data Unavailable</div>'}
                        </div>
                    </div>

                    <div class="pdf-citation">
                        <strong>CITATIONS & METHODOLOGY:</strong><br>
                        [1] Existing property footprint data retrieved dynamically from standard UK EPC registers via secure proxy.<br>
                        [2] Valuation calculations rely on regional average property values. This is a mathematical projection, not a formal RICS valuation.<br>
                        [3] Elevation models and Ordnance Survey mapping provided via remote server integration.
                    </div>
                </div>
                `;

                document.getElementById('pdf-content').innerHTML = html;

                // 4. TRIGGER HTML2PDF ENGINE
                btnElement.innerText = "Compiling PDF...";
                
                const element = document.getElementById('pdf-content');
                const opt = {
                    margin:       0,
                    filename:     `COHI_Survey_${data.customerProfile?.leadName || 'Client'}.pdf`,
                    image:        { type: 'jpeg', quality: 0.85 },
                    html2canvas:  { scale: 1.5, useCORS: true, allowTaint: true, logging: false },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                // Un-hide the DOM so the engine can photograph it
                document.getElementById('pdf-engine').style.display = 'block';
                
                // CRITICAL FIX: The browser needs a fraction of a second to physically load the Map Image before snapping the PDF
                await new Promise(resolve => setTimeout(resolve, 800));
                
                await html2pdf().set(opt).from(element).save();

            } catch (err) {
                alert("PDF Generation Failed: " + err.message);
                console.error(err);
            } finally {
                // Cleanup
                document.getElementById('pdf-engine').style.display = 'none';
                if (btnElement) {
                    btnElement.innerText = originalText;
                    btnElement.disabled = false;
                }
            }
        };
    </script>
</body>
</html>
