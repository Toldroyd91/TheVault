<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Survey Compiler</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <script>
        window.addEventListener('error', function(e) {
            const list = document.getElementById('surveyList');
            const overlay = document.getElementById('loadingOverlay');
            if(overlay) overlay.style.display = 'none';
            if(list) {
                list.style.display = 'block';
                list.innerHTML = `<div style="background: #b20710; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                    <h3 style="margin-top:0; color: #fff;">CRITICAL SYSTEM CRASH</h3>
                    <p style="font-weight: bold;">Error: ${e.message}</p>
                    <p style="font-size: 11px; opacity: 0.8;">File: ${e.filename} <br>Line: ${e.lineno}</p>
                </div>`;
            }
        });
    </script>

    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #0f3559; --text: #c9d1d9; --border: #30363d; }
        body { background: var(--bg); color: var(--text); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 40px; }
        
        .compiler-header { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; color: #fff; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; }
        
        .survey-list { display: grid; gap: 15px; max-width: 800px; }
        .survey-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .client-info h3 { margin: 0 0 5px 0; color: #fff; font-size: 16px; }
        .client-info p { margin: 0; font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn-pdf { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; transition: 0.2s; }
        .btn-pdf:disabled { background: #444; cursor: not-allowed; }

        .loading-overlay { display: none; text-align: center; padding: 40px; background: var(--card); border-radius: 8px; border: 1px solid var(--border-color); }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--accent); animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- STRICT A4 EDITORIAL PRINT TEMPLATE --- */
        #pdf-engine { display: none; }
        .pdf-page { width: 210mm; min-height: 297mm; background: #fff; color: #000; box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; position: relative; page-break-after: always; overflow: hidden; }
        
        /* STANDARD PAGE PADDING */
        .page-padded { padding: 20mm; display: flex; flex-direction: column; height: 100%; }
        
        /* COVER PAGE STYLES */
        .cover-page { background-color: #111; background-size: cover; background-position: center; }
        .cover-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(229, 9, 20, 0.92); clip-path: polygon(0 0, 75% 0, 45% 100%, 0% 100%); z-index: 1; }
        .cover-content { position: absolute; bottom: 30mm; left: 20mm; z-index: 2; color: #fff; max-width: 60%; }
        .cover-logo { font-size: 24px; font-weight: 900; letter-spacing: 4px; border-bottom: 2px solid #fff; padding-bottom: 10px; margin-bottom: 20px; display: inline-block; }
        .cover-title { font-size: 42px; font-weight: 900; line-height: 1; text-transform: uppercase; margin: 0 0 10px 0; letter-spacing: -1px; }
        .cover-client { font-size: 16px; color: #f8cdda; letter-spacing: 1px; text-transform: uppercase; }

        /* SPLIT PAGE STYLES */
        .split-page { display: flex; flex-direction: row; height: 297mm; padding: 0; }
        .split-img { width: 45%; height: 100%; background-size: cover; background-position: center; border-right: 4px solid #0f3559; }
        .split-content { width: 55%; padding: 20mm; box-sizing: border-box; display: flex; flex-direction: column; }
        
        /* FULL BLEED IMAGE PAGE */
        .img-page { width: 100%; height: 100%; background-size: cover; background-position: center; }

        /* EDITORIAL TYPOGRAPHY */
        .ed-header { border-bottom: 4px solid #000; padding-bottom: 10px; margin-bottom: 25px; }
        .ed-subtitle { font-size: 10px; font-weight: 900; color: #0f3559; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .ed-title { font-size: 28px; font-weight: 900; margin: 0; text-transform: uppercase; line-height: 1; letter-spacing: -1px; }
        
        .section-title { font-size: 12px; font-weight: bold; background: #000; color: #fff; padding: 8px 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        
        .pdf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .pdf-box { border: 1px solid #ddd; padding: 15px; background: #fafafa; }
        .pdf-box.full { grid-column: 1 / -1; }
        .pdf-box.highlight { border-left: 4px solid #0f3559; background: #fffcfc; }
        
        .pdf-label { font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: 8px; display: block; font-weight: bold; letter-spacing: 1px; }
        .pdf-val { font-size: 16px; font-weight: 900; color: #000; margin: 0 0 5px 0; }
        .pdf-desc { font-size: 11px; color: #444; line-height: 1.5; margin: 0; }
        
        /* TABLE OF CONTENTS */
        .toc-wrapper { margin-top: 30px; flex-grow: 1; }
        .toc-row { display: flex; align-items: baseline; margin-bottom: 18px; border-bottom: 1px dotted #ccc; padding-bottom: 8px; }
        .toc-num { font-size: 14px; font-weight: 900; color: #0f3559; margin-right: 15px; }
        .toc-text { font-size: 13px; font-weight: bold; color: #000; text-transform: uppercase; flex-grow: 1; }

        /* BIOS SECTION */
        .bio-section { margin-top: auto; padding-top: 20px; border-top: 1px solid #eee; }
        .bio-title { font-size: 10px; font-weight: bold; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .bio-name { font-size: 16px; font-weight: 900; color: #000; margin: 0; }
        .bio-role { font-size: 11px; color: #0f3559; margin-bottom: 5px; font-weight: bold; }
        .bio-text { font-size: 10px; color: #555; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="compiler-header">
        <div>
            <h1>PDF Compiler Engine</h1>
            <p style="margin: 5px 0 0 0; font-size: 12px; color: #8b949e;">High-End Dossier Layout</p>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner" id="mainSpinner"></div>
        <h3 style="color: #fff; margin:0;" id="loadingHeader">Compiling Dossier</h3>
        <p id="loadingStatus" style="color: #8b949e; font-size: 12px; margin-top: 10px;">Verifying secure session...</p>
    </div>

    <div class="survey-list" id="surveyList"></div>

    <div id="pdf-engine">
        <div id="pdf-content"></div>
    </div>

    <script type="module">
        import { auth, db, collection, getDocs, doc, getDoc, onAuthStateChanged, functions } from './js/core-firebase.js';
        import { httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

        let surveysData = {};
        let authResolved = false;

        const failsafeTimer = setTimeout(() => {
            if (!authResolved) {
                authResolved = true;
                loadCompiler();
            }
        }, 2000);

        onAuthStateChanged(auth, async (user) => {
            if (authResolved) return; 
            authResolved = true;
            clearTimeout(failsafeTimer);
            await loadCompiler();
        });

        async function loadCompiler() {
            const list = document.getElementById('surveyList');
            const urlId = new URLSearchParams(window.location.search).get('id');

            if (urlId) {
                list.style.display = 'none';
                document.getElementById('loadingOverlay').style.display = 'block';
                try {
                    const snap = await getDoc(doc(db, "surveys", urlId));
                    if (snap.exists()) {
                        surveysData[urlId] = snap.data();
                        await generatePDF(urlId, null); 
                        document.getElementById('loadingStatus').innerText = "Download Complete.";
                        document.getElementById('mainSpinner').style.display = 'none';
                    }
                } catch (e) {
                    document.getElementById('loadingStatus').innerText = "Error: " + e.message;
                }
                return; 
            }

            try {
                const querySnapshot = await getDocs(collection(db, "surveys"));
                list.innerHTML = '';
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    surveysData[docSnap.id] = data;
                    list.innerHTML += `
                        <div class="survey-card">
                            <div class="client-info">
                                <h3>${data.customerProfile?.leadName || 'Unnamed Lead'}</h3>
                                <p>${data.customerProfile?.postcode || 'No Postcode'} | ${data.projectSpecs?.buildType || 'TBC'}</p>
                            </div>
                            <button class="btn-pdf" onclick="generatePDF('${docSnap.id}', this)">Compile Dossier</button>
                        </div>
                    `;
                });
            } catch (error) {
                list.innerHTML = `<p style="color:red;">Database Error</p>`;
            }
        }

        window.generatePDF = async function(docId, btnElement) {
            const data = surveysData[docId];
            const pdfContent = document.getElementById('pdf-content');
            
            const brandRaw = data.brand || 'YORKSHIRE WINDOWS';
            const brandName = brandRaw.replace(/([A-Z])/g, ' $1').trim().toUpperCase();
            const clientName = data.customerProfile?.leadName || 'Client';
            const postcode = data.customerProfile?.postcode || '';
            const houseNum = data.customerProfile?.houseNumber || "1";
            const dateStr = new Date().toLocaleDateString('en-GB');

            // --- API DATA EXTRACTION ---
            let elevation = "Pending API";
            let epcData = { area: "TBC", rating: "TBC", walls: "TBC", roof: "TBC" };
            let osMapUrl = "";

            try {
                const cleanPC = postcode.replace(/\s+/g, '');
                const pcRes = await fetch(`https://api.postcodes.io/postcodes/${cleanPC}`);
                const pcData = await pcRes.json();
                
                if(pcData.status === 200) {
                    const lat = pcData.result.latitude;
                    const lng = pcData.result.longitude;
                    
                    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true&elevation=true`);
                    const weatherData = await weatherRes.json();
                    elevation = `${weatherData.elevation}m`;

                    const fetchEPC = httpsCallable(functions, 'fetchEPCData');
                    const epcRes = await fetchEPC({ postcode: cleanPC, houseNum: houseNum });
                    if(epcRes.data?.success && epcRes.data?.data) {
                        epcData.area = `${epcRes.data.data['total-floor-area']} m²`;
                        epcData.rating = epcRes.data.data['current-energy-rating']?.toUpperCase() || "TBC";
                        epcData.walls = epcRes.data.data['walls-description'] || "TBC";
                        epcData.roof = epcRes.data.data['roof-description'] || "TBC";
                    }

                    const fetchOS = httpsCallable(functions, 'fetchOSMap');
                    const osRes = await fetchOS({ lat: lat, lng: lng });
                    if(osRes.data?.url) osMapUrl = osRes.data.url;
                }
            } catch(e) { console.warn("Background API Fetch failed."); }

            // --- PAMPHLET PATHS ---
            // Ensure these files exist in your /images folder on GitHub
            const imgPath = './assets/shared/';
            const pamphletWhoWeAre = `${imgPath}who-we-are.jpg`;
            const pamphletPlanning = `${imgPath}planning.jpg`;
            const pamphletJourney = `${imgPath}journey.jpg`;
            const pamphletPiling = `${imgPath}piling.jpg`;

            let html = '';

            // =========================================================
            // PAGE 1: FULL BLEED MAP COVER PAGE
            // =========================================================
            html += `
                <div class="pdf-page cover-page" style="${osMapUrl ? `background-image: url('${osMapUrl}');` : 'background-color: #1a1a1a;'}">
                    <div class="cover-overlay"></div>
                    <div class="cover-content">
                        <div class="cover-logo">${brandName}</div>
                        <h1 class="cover-title">Feasibility<br>& Survey<br>Dossier</h1>
                        <p class="cover-client">Prepared for: ${clientName} | ${dateStr}</p>
                    </div>
                </div>
            `;

            // =========================================================
            // PAGE 2: BIOS & TOC (SPLIT PAGE)
            // =========================================================
            html += `
                <div class="pdf-page split-page">
                    <div class="split-img" style="background-image: url('${pamphletWhoWeAre}'); background-color: #f4f4f4;"></div>
                    <div class="split-content">
                        <div class="ed-header">
                            <div class="ed-subtitle">Executive Summary</div>
                            <h2 class="ed-title">Document Index</h2>
                        </div>
                        
                        <div class="toc-wrapper">
                            <div class="toc-row"><span class="toc-num">01</span><span class="toc-text">Site Intelligence & Financial Data</span></div>
                            <div class="toc-row"><span class="toc-num">02</span><span class="toc-text">Architectural Specifications</span></div>
                            <div class="toc-row"><span class="toc-num">03</span><span class="toc-text">Topographical Photography</span></div>
                            ${data.media?.sketch ? `<div class="toc-row"><span class="toc-num">04</span><span class="toc-text">Engineering Calibration Overlay</span></div>` : ''}
                            <div class="toc-row"><span class="toc-num">05</span><span class="toc-text">Regulatory Factsheets</span></div>
                        </div>

                        <div class="bio-section">
                            <div class="bio-title">Project Oversight</div>
                            <p class="bio-name">Thomas Oldroyd</p>
                            <p class="bio-role">Lead New Living Space Designer</p>
                            <p class="bio-text">Overseeing spatial design, planning logistics, and structural feasibility for high-end extensions across the South Yorkshire region.</p>
                        </div>
                    </div>
                </div>
            `;

            // =========================================================
            // PAGE 3: SITE INTELLIGENCE
            // =========================================================
            html += `
                <div class="pdf-page page-padded">
                    <div class="ed-header">
                        <div class="ed-subtitle">Section 01</div>
                        <h2 class="ed-title">Site Intelligence</h2>
                    </div>

                    <div class="section-title">Existing Property Intel (EPC Database)</div>
                    <div class="pdf-grid">
                        <div class="pdf-box highlight"><span class="pdf-label">Registered Internal Area</span><p class="pdf-val">${epcData.area}</p></div>
                        <div class="pdf-box"><span class="pdf-label">Energy Efficiency</span><p class="pdf-val">${epcData.rating}</p></div>
                        <div class="pdf-box full"><span class="pdf-label">Existing Envelope</span><p class="pdf-desc"><strong>Walls:</strong> ${epcData.walls}<br><strong>Roof:</strong> ${epcData.roof}</p></div>
                    </div>

                    <div class="section-title">Topographical Constraints</div>
                    <div class="pdf-grid">
                        <div class="pdf-box"><span class="pdf-label">Elevation</span><p class="pdf-val">${elevation}</p></div>
                        <div class="pdf-box"><span class="pdf-label">Local Authority</span><p class="pdf-val">South Yorkshire</p></div>
                        <div class="pdf-box full"><span class="pdf-label">Surveyor Access Notes</span><p class="pdf-desc">${data.projectSpecs?.accessIssues || 'Unrestricted'}</p></div>
                    </div>
                </div>
            `;

            // =========================================================
            // PAGE 4: LOGISTICS (SPLIT PAGE WITH PILING IMAGE)
            // =========================================================
            html += `
                <div class="pdf-page split-page">
                    <div class="split-content">
                        <div class="ed-header">
                            <div class="ed-subtitle">Section 02</div>
                            <h2 class="ed-title">Specifications</h2>
                        </div>
                        
                        <div class="section-title" style="margin-top: 20px;">Core Materials</div>
                        <div class="pdf-box" style="margin-bottom: 10px;"><span class="pdf-label">Structure</span><p class="pdf-val">${data.projectSpecs?.buildType || 'TBC'}</p></div>
                        <div class="pdf-box" style="margin-bottom: 10px;"><span class="pdf-label">Roof System</span><p class="pdf-val">${data.projectSpecs?.roofStyle || 'TBC'}</p></div>
                        <div class="pdf-box" style="margin-bottom: 20px;"><span class="pdf-label">Foundation Sub-Base</span><p class="pdf-val">Standard Specification</p></div>

                        <div class="section-title">Surveyor Field Notes</div>
                        <p class="pdf-desc" style="font-style: italic;">"${data.designerInsights?.prep || 'No anomalies recorded. Standard tolerances apply.'}"</p>
                    </div>
                    <div class="split-img" style="background-image: url('${pamphletPiling}'); border-left: 4px solid #000; border-right: none;"></div>
                </div>
            `;

            // =========================================================
            // PAGE 5: PLANNING PAMPHLET (FULL BLEED BREAK PAGE)
            // =========================================================
            html += `
                <div class="pdf-page img-page" style="background-image: url('${pamphletPlanning}'); background-color: #fafafa;"></div>
            `;

            // =========================================================
            // GENERATE PDF
            // =========================================================
            pdfContent.innerHTML = html;
            const element = document.getElementById('pdf-content');
            
            const opt = {
                margin:       0,
                filename:     `COHI_Dossier_${clientName.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.95 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            document.getElementById('pdf-engine').style.display = 'block';
            await new Promise(resolve => setTimeout(resolve, 800)); // Allow OS map & pamphlets to paint
            
            try {
                await html2pdf().set(opt).from(element).save();
            } catch (err) {
                alert("Generation Failed: " + err.message);
            } finally {
                document.getElementById('pdf-engine').style.display = 'none';
            }
        };
    </script>
</body>
</html>
