<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compiling Dossier...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
</head>
<body class="bg-[#0a0a0c] text-[#f4f4f6] h-screen flex flex-col items-center justify-center font-sans">

    <div class="text-center space-y-6">
        <span class="material-icons-round text-6xl text-[#005A9C] animate-pulse">auto_awesome_mosaic</span>
        <h1 class="text-2xl font-black uppercase tracking-widest">Generating Master Dossier</h1>
        <div id="statusLog" class="text-xs text-gray-500 font-mono space-y-2 text-left bg-[#141418] p-6 rounded-lg border border-[#27272f] min-w-[350px] max-w-md mx-auto h-48 overflow-y-auto">
            <p>> Initializing rendering engine...</p>
        </div>
    </div>

    <script type="module">
        import { db, doc, getDoc } from './js/core-firebase.js';

        const log = (msg, isSuccess = false, isError = false) => {
            const logBox = document.getElementById('statusLog');
            let color = 'text-gray-500';
            if (isSuccess) color = 'text-[#238636] font-bold';
            if (isError) color = 'text-red-500 font-bold';
            logBox.innerHTML += `<p class="${color}">> ${msg}</p>`;
            logBox.scrollTop = logBox.scrollHeight;
        };

        async function fetchImageAsBase64(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response error');
                const blob = await response.blob();
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (e) {
                console.warn(`Failed to load image: ${url}`);
                return null;
            }
        }

        async function generatePDF() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const projectId = urlParams.get('id') || "DEMO_PROJECT_123";
                
                log(`Extracting payload for ID: ${projectId}...`);
                const docSnap = await getDoc(doc(db, "surveys", projectId));

                if (!docSnap.exists()) {
                    log("ERROR: No data found. Run a sync first.", false, true);
                    return;
                }

                const data = docSnap.data();
                const profile = data.customerProfile || {};
                const specs = data.projectSpecs || {};
                const media = data.media || {};
                const pamphlets = data.pamphlets || {};
                const insights = data.designerInsights || {};
                
                // Fallback Designer Profile (if dynamic setup hasn't been done yet)
                const designer = data.designerProfile || {
                    name: "Thomas Oldroyd",
                    role: "New Living Space Designer",
                    bio: "Operating out of South Yorkshire, Thomas specializes in transforming existing architectural footprints into modern, thermally efficient living spaces. With a focus on meticulous site surveys and client-focused design, Thomas ensures that every structure perfectly complements the primary residence while adhering to strict building regulations.",
                    headshot: null,
                    portfolio: [] // Array of base64 images
                };

                // Simulated Live Review Data (Will be replaced by your API scraper later)
                const reviews = data.brandReviews || {
                    trustpilot: { score: "4.8", count: "1,204" },
                    google: { score: "4.9", count: "856" }
                };
                
                log("Structuring Strategic Sales Flow...");
                const gitHubBase = "https://raw.githubusercontent.com/Toldroyd91/TheVault/main/assets/shared/";
                const content = [];

                // ==========================================
                // 1. COVER PAGE & CONTENTS
                // ==========================================
                content.push(
                    { text: 'YORKSHIRE', fontSize: 48, font: 'Helvetica', bold: true, color: '#005A9C', margin: [0, 150, 0, 0], alignment: 'center' },
                    { text: 'WINDOWS', fontSize: 48, font: 'Helvetica', bold: true, color: '#27272f', margin: [0, -10, 0, 20], alignment: 'center' },
                    { text: 'MASTER ARCHITECTURAL DOSSIER', fontSize: 14, bold: true, letterSpacing: 2, alignment: 'center', margin: [0, 0, 0, 50] },
                    { canvas: [{ type: 'line', x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 2, lineColor: '#005A9C' }], margin: [0, 0, 0, 20] },
                    { text: `PREPARED FOR: ${profile.leadName ? profile.leadName.toUpperCase() : 'CLIENT'}`, fontSize: 12, bold: true, alignment: 'center', margin: [0, 0, 0, 5] },
                    { text: `SITE LOCATION: ${profile.postcode ? profile.postcode.toUpperCase() : 'TBD'}`, fontSize: 12, color: '#555555', alignment: 'center', margin: [0, 0, 0, 50] },
                    { text: `LEAD DESIGNER: ${designer.name.toUpperCase()}`, fontSize: 10, bold: true, color: '#8b8b93', alignment: 'center', pageBreak: 'after' },
                    
                    { toc: { title: { text: 'DOCUMENT CONTENTS', style: 'header', margin: [0, 0, 0, 20] } }, pageBreak: 'after' }
                );

                // ==========================================
                // 2. THE PITCH (Company Profile)
                // ==========================================
                if (pamphlets.brochure) {
                    log("Injecting Company Profile...");
                    content.push({ text: '01. THE YORKSHIRE WINDOWS STANDARD', style: 'sectionHeader', tocItem: true, pageBreak: 'before' });
                    
                    const whoImg = await fetchImageAsBase64(`${gitHubBase}who-we-are.jpg`);
                    if(whoImg) content.push({ image: whoImg, width: 515, alignment: 'center', pageBreak: 'before' });
                    
                    const whyImg = await fetchImageAsBase64(`${gitHubBase}why-choose-us.jpg`);
                    if(whyImg) content.push({ image: whyImg, width: 515, alignment: 'center', pageBreak: 'before' });

                    const tailImg = await fetchImageAsBase64(`${gitHubBase}tailored.jpg`);
                    if(tailImg) content.push({ image: tailImg, width: 515, alignment: 'center', pageBreak: 'after' });
                }

                // ==========================================
                // 3. SOCIAL PROOF (Live Reviews)
                // ==========================================
                log("Injecting Review Framework...");
                content.push(
                    { text: '02. CLIENT TRUST & VERIFICATION', style: 'sectionHeader', tocItem: true },
                    { text: 'Our commitment to quality is reflected in the live feedback from our local community.', margin: [0, 0, 0, 30] },
                    {
                        columns: [
                            {
                                width: '50%',
                                alignment: 'center',
                                stack: [
                                    { text: '★ ★ ★ ★ ★', fontSize: 24, color: '#00b67a', margin: [0, 0, 0, 10] }, // Trustpilot green
                                    { text: 'TRUSTPILOT', fontSize: 14, bold: true, margin: [0, 0, 0, 5] },
                                    { text: `${reviews.trustpilot.score} / 5.0`, fontSize: 20, bold: true, color: '#27272f' },
                                    { text: `Based on ${reviews.trustpilot.count} reviews`, fontSize: 10, color: '#8b8b93', margin: [0, 5, 0, 0] }
                                ]
                            },
                            {
                                width: '50%',
                                alignment: 'center',
                                stack: [
                                    { text: '★ ★ ★ ★ ★', fontSize: 24, color: '#fbbc05', margin: [0, 0, 0, 10] }, // Google yellow
                                    { text: 'GOOGLE REVIEWS', fontSize: 14, bold: true, margin: [0, 0, 0, 5] },
                                    { text: `${reviews.google.score} / 5.0`, fontSize: 20, bold: true, color: '#27272f' },
                                    { text: `Based on ${reviews.google.count} verified client ratings`, fontSize: 10, color: '#8b8b93', margin: [0, 5, 0, 0] }
                                ]
                            }
                        ],
                        margin: [0, 0, 0, 40]
                    },
                    { canvas: [{ type: 'line', x1: 100, y1: 0, x2: 415, y2: 0, lineWidth: 1, lineColor: '#e5e7eb' }], margin: [0, 20, 0, 20] },
                    { text: 'This data is dynamically linked to independent review platforms and updates automatically.', fontSize: 8, italics: true, color: '#8b8b93', alignment: 'center', pageBreak: 'after' }
                );

                // ==========================================
                // 4. THE PERSONAL TOUCH (Meet the Designer)
                // ==========================================
                log("Building Dynamic Designer Profile...");
                content.push({ text: '03. MEET YOUR DESIGNER', style: 'sectionHeader', tocItem: true });

                const designerLayout = { columns: [], margin: [0, 0, 0, 30] };
                
                // If the user has uploaded a headshot to their profile, render it on the left
                if (designer.headshot) {
                    designerLayout.columns.push({ image: designer.headshot, width: 150, margin: [0, 0, 20, 0] });
                }

                // Push the text bio to the right (or full width if no headshot)
                designerLayout.columns.push({
                    stack: [
                        { text: designer.name.toUpperCase(), fontSize: 18, bold: true, color: '#005A9C', margin: [0, 0, 0, 5] },
                        { text: designer.role, fontSize: 12, bold: true, color: '#555', margin: [0, 0, 0, 15] },
                        { text: designer.bio, lineHeight: 1.5, fontSize: 11, color: '#27272f' }
                    ]
                });
                content.push(designerLayout);

                // If portfolio images exist in the designer's profile, render a mini grid
                if (designer.portfolio && designer.portfolio.length > 0) {
                    content.push({ text: 'RECENT PORTFOLIO', fontSize: 10, bold: true, color: '#8b8b93', margin: [0, 0, 0, 10] });
                    const gridBody = [];
                    // Simplified: just dumping the first two portfolio images side-by-side for the demo
                    if (designer.portfolio.length >= 2) {
                        gridBody.push([
                            { image: designer.portfolio[0], width: 250 },
                            { image: designer.portfolio[1], width: 250 }
                        ]);
                    }
                    if(gridBody.length > 0) {
                        content.push({ table: { widths: ['*', '*'], body: gridBody }, layout: 'noBorders' });
                    }
                }
                content[content.length - 1].pageBreak = 'after'; // Page break after designer section

                // ==========================================
                // 5. THE PROCESS (Installation Journey)
                // ==========================================
                log("Fetching Process Journey...");
                content.push({ text: '04. THE INSTALLATION JOURNEY', style: 'sectionHeader', tocItem: true });
                const journeyImg = await fetchImageAsBase64(`${gitHubBase}journey.jpg`);
                if(journeyImg) {
                    content.push({ image: journeyImg, width: 515, alignment: 'center', margin: [0, 10, 0, 0], pageBreak: 'after' });
                } else {
                    content.push({ text: "[ Process graphic unavailable ]", alignment: 'center', pageBreak: 'after' });
                }

                // ==========================================
                // 6. THE CUSTOM PROJECT (Survey Data)
                // ==========================================
                log("Integrating Site Specifications...");
                content.push(
                    { text: '05. BESPOKE PROJECT SPECIFICATIONS', style: 'sectionHeader', tocItem: true },
                    {
                        layout: 'lightHorizontalLines',
                        table: {
                            headerRows: 1, widths: ['*', '*'],
                            body: [
                                [{text: 'CLIENT DETAILS', bold: true, color: '#005A9C'}, {text: 'SITE DETAILS', bold: true, color: '#005A9C'}],
                                [`Name: ${profile.leadName || 'N/A'}`, `Postcode: ${profile.postcode || 'N/A'}`],
                                [`Customer Ref: ${profile.customerNum || 'N/A'}`, `Appt Date: ${profile.apptDate || 'N/A'}`]
                            ]
                        }, margin: [0, 0, 0, 30]
                    },
                    {
                        layout: 'lightHorizontalLines',
                        table: {
                            widths: ['*', '*'],
                            body: [
                                ['Build Type:', specs.buildType || 'N/A'],
                                ['Roof Architecture:', specs.roofStyle || 'N/A'],
                                ['Base / Foundations:', specs.baseType || 'N/A'],
                                ['Proposed Footprint:', specs.proposedSize || 'N/A'],
                                ['Frame Finish:', specs.frameColour || 'N/A'],
                                ['Building Regulations:', specs.buildingRegs || 'N/A']
                            ]
                        }, margin: [0, 0, 0, 30]
                    },
                    { text: 'DESIGNER ENGINEERING NOTES', fontSize: 10, bold: true, color: '#005A9C', margin: [0, 0, 0, 5] },
                    { text: insights.prep || "No structural notes recorded during survey.", fontSize: 10, italics: true, color: '#555', pageBreak: 'after' }
                );

                // ==========================================
                // 7. SITE PHOTOGRAPHY
                // ==========================================
                log("Injecting Context Photography...");
                const photos = [
                    { src: media.front, title: 'Main Elevation as seen from the road' },
                    { src: media.rear, title: 'Rear Elevation' },
                    { src: media.side, title: 'Side Context & Access' },
                    { src: media.sketch, title: 'Architectural Markup' }
                ];

                let photoAdded = false;
                photos.forEach(photo => {
                    if (photo.src) {
                        if(!photoAdded) {
                            content.push({ text: '06. SITE PHOTOGRAPHY', style: 'sectionHeader', tocItem: true });
                            photoAdded = true;
                        }
                        content.push(
                            { text: photo.title, fontSize: 10, bold: true, margin: [0, 15, 0, 5], color: '#555' },
                            { image: photo.src, width: 515, alignment: 'center', margin: [0, 0, 0, 20] }
                        );
                    }
                });
                if (photoAdded) content[content.length - 1].pageBreak = 'after';

                // ==========================================
                // 8. TECHNICAL APPENDICES (Compliance)
                // ==========================================
                log("Attaching Compliance & Technical Data...");

                if (pamphlets.roof) {
                    content.push({ text: 'APPENDIX A: ENGINEERING (Piling & Box Guttering Detail)', style: 'sectionHeader', tocItem: true, pageBreak: 'before' });
                    const pileImg = await fetchImageAsBase64(`${gitHubBase}piling.jpg`);
                    if(pileImg) content.push({ image: pileImg, width: 515, alignment: 'center' });
                    
                    const cavImg = await fetchImageAsBase64(`${gitHubBase}cavity.jpg`);
                    if(cavImg) content.push({ image: cavImg, width: 515, alignment: 'center', pageBreak: 'before' });
                }

                if (pamphlets.sap) {
                    content.push({ text: 'APPENDIX B: SAP CALCULATIONS', style: 'sectionHeader', tocItem: true, pageBreak: 'before' });
                    const sapImg = await fetchImageAsBase64(`${gitHubBase}sap-calcs.jpg`);
                    if(sapImg) content.push({ image: sapImg, width: 515, alignment: 'center' });
                }

                if (pamphlets.planning) {
                    content.push({ text: 'APPENDIX C: PLANNING & REGULATIONS', style: 'sectionHeader', tocItem: true, pageBreak: 'before' });
                    const planImg = await fetchImageAsBase64(`${gitHubBase}planning.jpg`);
                    if(planImg) content.push({ image: planImg, width: 515, alignment: 'center' });
                }

                if (pamphlets.warranty) {
                    content.push({ text: 'APPENDIX D: HOME PROTECTION & WARRANTY', style: 'sectionHeader', tocItem: true, pageBreak: 'before' });
                    const protImg = await fetchImageAsBase64(`${gitHubBase}protecting-home.jpg`);
                    if(protImg) content.push({ image: protImg, width: 515, alignment: 'center' });
                }

                // ==========================================
                // RENDER DOCUMENT
                // ==========================================
                const docDefinition = {
                    pageSize: 'A4',
                    pageMargins: [40, 60, 40, 60],
                    header: function(currentPage) {
                        if (currentPage === 1) return null;
                        return { text: 'YORKSHIRE WINDOWS | ARCHITECTURAL DOSSIER', margin: [40, 20, 40, 0], fontSize: 8, color: '#8b8b93', alignment: 'right' };
                    },
                    footer: function(currentPage, pageCount) {
                        if (currentPage === 1) return null;
                        return { text: `Page ${currentPage.toString()} of ${pageCount}`, margin: [40, 0, 40, 20], fontSize: 8, color: '#8b8b93', alignment: 'center' };
                    },
                    content: content,
                    styles: {
                        header: { fontSize: 18, bold: true, color: '#005A9C', font: 'Helvetica' },
                        sectionHeader: { fontSize: 14, bold: true, color: '#005A9C', margin: [0, 15, 0, 10], font: 'Helvetica' }
                    },
                    defaultStyle: { fontSize: 11, color: '#27272f', font: 'Helvetica' }
                };

                log("Assembling Final Vector Data...");
                pdfMake.createPdf(docDefinition).download(`Yorkshire_Windows_Dossier_${profile.leadName ? profile.leadName.replace(/\s+/g, '_') : 'Client'}.pdf`);
                log("Dossier Generated Successfully ✓", true);

            } catch (err) {
                console.error(err);
                log(`Generation Failed: ${err.message}`, false, true);
            }
        }

        window.onload = () => { setTimeout(generatePDF, 500); };
    </script>
</body>
</html>
