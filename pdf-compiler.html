<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dossier Compiler | COHI Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #mobileNavOverlay { display: none; }
        #mobileNavOverlay.active { display: block; }
    </style>
</head>
<body class="bg-[#050505] text-white overflow-hidden flex h-screen w-full">

    <!-- Mobile Header -->
    <div class="md:hidden flex items-center justify-between bg-[#161b22] p-4 border-b border-[#30363d] absolute top-0 w-full z-40 shadow-md">
        <h2 class="text-white font-black uppercase text-lg m-0">COHI<span class="text-[#0dcaf0]">PRO</span></h2>
        <button id="mobileMenuBtn" class="text-white text-2xl p-2">☰</button>
    </div>

    <!-- Mobile Overlay -->
    <div id="mobileNavOverlay" class="fixed inset-0 bg-black/70 z-40 md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- GLOBAL SIDEBAR NAVIGATION -->
    <nav id="appSidebar" class="w-64 md:w-72 bg-[#090d13] border-r border-[#30363d] h-full flex flex-col fixed md:relative z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 shadow-2xl md:shadow-none">
        <div class="p-6 border-b border-[#30363d] flex justify-between items-center bg-[#05080c]">
            <h2 class="text-white font-black uppercase text-xl m-0 tracking-widest">COHI<span class="text-[#0dcaf0]">PRO</span></h2>
            <button id="closeMenuBtn" class="md:hidden text-gray-400 hover:text-white text-xl">✕</button>
        </div>
        
        <div class="flex-1 overflow-y-auto py-6 flex flex-col gap-2 px-4">
            <a href="index.html" class="flex items-center gap-3 w-full text-left p-3 rounded-lg text-sm font-bold uppercase tracking-wide text-gray-400 hover:bg-white/5 hover:text-white transition">
                <span class="text-lg">📊</span> Pipeline
            </a>
            <a href="property-intel.html" class="flex items-center gap-3 w-full text-left p-3 rounded-lg text-sm font-bold uppercase tracking-wide text-gray-400 hover:bg-white/5 hover:text-white transition">
                <span class="text-lg">🌍</span> Site Intel
            </a>
            <a href="survey.html" class="flex items-center gap-3 w-full text-left p-3 rounded-lg text-sm font-bold uppercase tracking-wide text-gray-400 hover:bg-white/5 hover:text-white transition">
                <span class="text-lg">📝</span> Survey Engine
            </a>
            <a href="quotes.html" class="flex items-center gap-3 w-full text-left p-3 rounded-lg text-sm font-bold uppercase tracking-wide text-gray-400 hover:bg-white/5 hover:text-white transition">
                <span class="text-lg">💷</span> Quote Scraper
            </a>
            <a href="admin-gatekeeper.html" class="flex items-center gap-3 w-full text-left p-3 rounded-lg text-sm font-bold uppercase tracking-wide text-gray-400 hover:bg-white/5 hover:text-white transition">
                <span class="text-lg">🔒</span> Gatekeeper
            </a>
            <a href="pdf-compiler.html" class="flex items-center gap-3 w-full text-left p-3 rounded-lg text-sm font-bold uppercase tracking-wide text-[#0dcaf0] bg-[#0dcaf0]/10 border border-[#0dcaf0]/30 shadow-[inset_4px_0_0_#0dcaf0] transition">
                <span class="text-lg">🗂️</span> Dossiers
            </a>
        </div>
    </nav>

    <!-- MAIN SCROLLABLE WORKSPACE -->
    <main class="flex-1 h-full overflow-y-auto p-4 md:p-10 relative pt-20 md:pt-10 bg-[#0d1117]">
        
        <div class="max-w-5xl mx-auto">
            <header class="border-b border-[#30363d] pb-6 mb-8 flex justify-between items-end">
                <div>
                    <h1 class="text-2xl md:text-3xl font-black text-white uppercase tracking-widest m-0">Dossier Compiler</h1>
                    <p class="text-xs text-[#0dcaf0] font-bold uppercase tracking-widest mt-2">Enterprise PDF Generation API (v2.0)</p>
                </div>
            </header>

            <div class="flex flex-col gap-4" id="surveyList">
                <div class="text-[#0dcaf0] font-bold text-sm uppercase tracking-widest animate-pulse p-6 bg-[#161b22] rounded-xl border border-[#30363d] text-center">
                    Authenticating secure connection...
                </div>
            </div>
        </div>
    </main>

    <script>
        const toggleMenu = () => {
            document.getElementById('appSidebar').classList.toggle('-translate-x-full');
            document.getElementById('mobileNavOverlay').classList.toggle('active');
        };
        document.getElementById('mobileMenuBtn')?.addEventListener('click', toggleMenu);
        document.getElementById('closeMenuBtn')?.addEventListener('click', toggleMenu);
        document.getElementById('mobileNavOverlay')?.addEventListener('click', toggleMenu);
    </script>
    <script type="module">
        import { auth, db, collection, getDocs, onAuthStateChanged, functions } from './js/core-firebase.js';
        import { httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

        let surveysData = {};

        // PDFMonkey Credentials
        const API_KEY = "Nio_f_23RrL7cVQrtbx3";
        const TEMPLATE_ID = "A4E984E9-096E-4015-8884-EB46AD51CDCE"; 

        onAuthStateChanged(auth, async (user) => {
            await loadCompiler();
        });

        async function loadCompiler() {
            const list = document.getElementById('surveyList');
            try {
                const querySnapshot = await getDocs(collection(db, "surveys"));
                
                let surveysArray = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    surveysData[docSnap.id] = data; 
                    surveysArray.push({ id: docSnap.id, data: data });
                });

                if (surveysArray.length === 0) {
                    list.innerHTML = '<div class="p-8 text-center text-gray-500 border border-[#30363d] rounded-xl bg-[#161b22]">No surveys found in database.</div>';
                    return;
                }

                // 1. Identify the absolute newest survey
                let newestIndex = 0;
                let maxTs = 0;
                
                surveysArray.forEach((survey, index) => {
                    let ts = survey.data.timestamp || 0;
                    if (!ts && survey.data.customerProfile?.apptDate) {
                        const parts = survey.data.customerProfile.apptDate.split('/');
                        if (parts.length === 3) {
                            ts = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`).getTime();
                        } else if (survey.data.customerProfile.apptDate.includes('-')) {
                            ts = new Date(survey.data.customerProfile.apptDate).getTime();
                        }
                    }
                    if (ts >= maxTs) {
                        maxTs = ts;
                        newestIndex = index;
                    }
                });

                const newestSurvey = surveysArray.splice(newestIndex, 1)[0];

                // 2. Sort the remaining array alphabetically A-Z
                surveysArray.sort((a, b) => {
                    let nameA = (a.data.customerProfile?.leadName || 'Unnamed').toLowerCase();
                    let nameB = (b.data.customerProfile?.leadName || 'Unnamed').toLowerCase();
                    return nameA.localeCompare(nameB);
                });

                list.innerHTML = '';
                list.innerHTML += renderSurveyCard(newestSurvey, true);

                if (surveysArray.length > 0) {
                    list.innerHTML += `
                        <div class="mt-8 mb-4 border-b border-[#30363d] pb-2">
                            <h3 class="text-xs text-gray-500 font-bold uppercase tracking-widest m-0">All Projects Archive (A-Z)</h3>
                        </div>
                    `;
                    surveysArray.forEach((survey) => {
                        list.innerHTML += renderSurveyCard(survey, false);
                    });
                }
            } catch (error) {
                list.innerHTML = `<div class="p-6 bg-red-900/20 text-red-500 border border-red-900/50 rounded-xl">Database Connection Error: ${error.message}</div>`;
            }
        }

        function renderSurveyCard(survey, isNewest) {
            const data = survey.data;
            const badge = isNewest ? `<span class="bg-[#0dcaf0]/20 text-[#0dcaf0] px-3 py-1 rounded text-[10px] font-bold uppercase tracking-widest mb-3 inline-block border border-[#0dcaf0]/50 shadow-[0_0_10px_rgba(13,202,240,0.2)]">Current Survey</span><br>` : '';
            const borderStyle = isNewest ? `border-[#0dcaf0]/50 shadow-[0_0_20px_rgba(13,202,240,0.05)]` : `border-[#30363d]`;
            
            return `
                <div class="bg-[#161b22] border ${borderStyle} p-5 md:p-6 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition hover:border-gray-500">
                    <div>
                        ${badge}
                        <h3 class="m-0 font-black text-white text-xl md:text-2xl tracking-wide">${data.customerProfile?.leadName || 'Unnamed Lead'}</h3>
                        <p class="m-0 mt-1 text-xs text-gray-400 font-bold uppercase tracking-widest">${data.customerProfile?.postcode || 'No Postcode'} <span class="mx-2 text-[#30363d]">|</span> ${data.projectSpecs?.buildType || 'TBC'}</p>
                    </div>
                    <div class="flex flex-wrap md:flex-nowrap gap-3 w-full md:w-auto">
                        <a href="survey.html?id=${survey.id}" class="flex-1 md:flex-none text-center px-6 py-3 bg-transparent border border-[#30363d] text-gray-300 font-bold uppercase tracking-widest text-xs rounded hover:bg-[#21262d] hover:text-white transition">
                            Edit Survey
                        </a>
                        <button onclick="generateDossier('${survey.id}', this)" class="flex-1 md:flex-none px-6 py-3 bg-[#0dcaf0] text-black font-black uppercase tracking-widest text-xs rounded hover:bg-cyan-400 transition shadow-[0_4px_15px_rgba(13,202,240,0.3)]">
                            Compile Dossier
                        </button>
                    </div>
                </div>
            `;
        }

        function getSafeArray(arr, fallbackImage) {
            if (arr && Array.isArray(arr) && arr.length > 0) return arr;
            return [fallbackImage];
        }

        window.generateDossier = async function(docId, btnElement) {
            if (btnElement) {
                btnElement.innerText = "Extracting...";
                btnElement.classList.add('opacity-75', 'cursor-not-allowed');
                btnElement.disabled = true;
            }

            const data = surveysData[docId];
            
            const brandFolderMap = {
                "Yorkshire Windows": "yorkshirewindows",
                "Clearview": "clearview",
                "Orion": "orion",
                "Planet": "planet",
                "Trent Valley": "trentvalley",
                "West Yorkshire": "westyorkshire"
            };
            const brandFolder = brandFolderMap[data.brand] || "shared";
            const dynamicLogoUrl = `https://raw.githubusercontent.com/Toldroyd91/TheVault/main/assets/${brandFolder}/logo.png`;

            const clientName = data.customerProfile?.leadName || 'Client';
            const dateStr = data.customerProfile?.apptDate || new Date().toLocaleDateString('en-GB');
            
            let sqMetres = "TBC";
            let valuationUplift = "TBC";
            if (data.projectSpecs?.proposedSize) {
                const match = data.projectSpecs.proposedSize.match(/(\d+)\s*x\s*(\d+)/);
                if (match) {
                    const sq = ((parseInt(match[1]) / 1000) * (parseInt(match[2]) / 1000)).toFixed(2);
                    sqMetres = `${sq} m²`;
                    valuationUplift = `£${(sq * 2600).toLocaleString('en-GB')}`;
                }
            }

            const dpc = data.designerInsights?.design?.includes('DPC Depth:') ? data.designerInsights.design.split('DPC Depth: ')[1].split('\n')[0] : '150mm';
            const base = data.designerInsights?.design?.includes('Base Type:') ? data.designerInsights.design.split('Base Type: ')[1].split('\n')[0] : 'Standard Concrete';

            let osMapUrl = "https://images.unsplash.com/photo-1524661135-423995f22d0b";
            let epcData = { area: "TBC", rating: "TBC", walls: "TBC", roof: "TBC" };

            try {
                const cleanPC = (data.customerProfile?.postcode || '').replace(/\s+/g, '');
                const houseNum = data.customerProfile?.houseNumber || "1";
                const pcRes = await fetch(`https://api.postcodes.io/postcodes/${cleanPC}`);
                const pcData = await pcRes.json();
                
                if(pcData.status === 200) {
                    const lat = pcData.result.latitude;
                    const lng = pcData.result.longitude;
                    
                    const fetchEPC = httpsCallable(functions, 'fetchEPCData');
                    const epcRes = await fetchEPC({ postcode: cleanPC, houseNum: houseNum });
                    if(epcRes.data?.success && epcRes.data?.data) {
                        epcData.area = `${epcRes.data.data['total-floor-area']} m²`;
                        epcData.rating = epcRes.data.data['current-energy-rating']?.toUpperCase() || "TBC";
                        epcData.walls = epcRes.data.data['walls-description'] || "Standard";
                        epcData.roof = epcRes.data.data['roof-description'] || "Standard";
                    }

                    const fetchOS = httpsCallable(functions, 'fetchOSMap');
                    const osRes = await fetchOS({ lat: lat, lng: lng, type: 'satellite' });
                    if(osRes.data?.url) osMapUrl = osRes.data.url;
                }
            } catch(e) { console.warn("API Fetch bypassed."); }

            const payload = {
                document: {
                    document_template_id: TEMPLATE_ID,
                    status: "pending",
                    payload: {
                        logo_url: dynamicLogoUrl,
                        client_name: clientName,
                        appt_date: dateStr,
                        map_url: osMapUrl,
                        designer_name: data.designer?.name || "Thomas Oldroyd",
                        designer_photo: data.designer?.photoUrl || "https://images.unsplash.com/photo-1560250097-0b93528c311a",
                        designer_bio: data.designer?.bio || "As your dedicated structural design specialist for the region, my mandate is to ensure this proposed development exceeds both your spatial expectations and strict UK regulatory standards.",
                        discussion_summary: data.discussionSummary || "Awaiting Rilla AI synthesis output for this consultation...",
                        trustpilot_score: data.trustpilotScore || "4.8 / 5.0 - Excellent",
                        build_type: data.projectSpecs?.buildType || "TBC",
                        roof_style: data.projectSpecs?.roofStyle || "TBC",
                        dimensions: data.projectSpecs?.proposedSize || "TBC",
                        frame_colour: data.projectSpecs?.frameColour || "TBC",
                        sq_metres: sqMetres,
                        valuation_uplift: valuationUplift,
                        epc_area: epcData.area,
                        epc_rating: epcData.rating,
                        epc_walls: epcData.walls,
                        epc_roof: epcData.roof,
                        elevation: "Calculated via Postcode API",
                        snow_load: "850 kg / Region Adjusted",
                        access_width: data.projectSpecs?.accessWidth ? `${data.projectSpecs.accessWidth}mm` : "TBC",
                        access_issues: data.projectSpecs?.accessIssues || "TBC",
                        base_type: base !== 'Standard Concrete' ? base : "TBC",
                        drainage: data.logistics?.drainage || "TBC",
                        house_material: data.projectSpecs?.houseMaterial || "TBC",
                        dpc_depth: dpc !== '150mm' ? dpc : "TBC",
                        wall_obstacles: data.projectSpecs?.wallObstacles || "TBC",
                        planning_perms: data.projectSpecs?.planningPerms || "Permitted Development",
                        building_regs: data.projectSpecs?.buildingRegs || "Full Building Control Required",
                        sap_calcs: data.compliance?.sapCalcs === "Yes" ? "Required" : "Exempt",
                        field_notes: data.designerInsights?.prep || "Standard structural engineering tolerances apply. Proceed to manufacturing.",
                        sketch_image: data.rawAssets?.sniper?.[0] || "https://images.unsplash.com/photo-1503387762-592deb58ef4e",
                        photos_masonry: getSafeArray(data.rawAssets?.brick, "https://images.unsplash.com/photo-1518640035035-7c08b50346c7"),
                        pamphlet_who_we_are: "https://images.unsplash.com/photo-1497366216548-37526070297c",
                        pamphlet_why_choose_us: "https://images.unsplash.com/photo-1497366216548-37526070297c"
                    },
                    meta: {
                        _filename: `Pre_Design_Consultation_${clientName.replace(/\s+/g, '_')}.pdf`
                    }
                }
            };

            try {
                const response = await fetch("https://api.pdfmonkey.io/api/v1/documents", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.document && result.document.id) {
                    pollPDFStatus(result.document.id, btnElement);
                } else {
                    alert("Document payload rejected. Check console for errors.");
                    console.error(result.errors);
                    resetButton(btnElement);
                }
            } catch (err) {
                alert("Server Connection Error: " + err.message);
                resetButton(btnElement);
            }
        };

        function resetButton(btnElement) {
            if(btnElement) { 
                btnElement.innerText = "Compile Dossier"; 
                btnElement.classList.remove('opacity-75', 'cursor-not-allowed');
                btnElement.disabled = false; 
            }
        }

        async function pollPDFStatus(docId, btnElement) {
            const checkStatus = async () => {
                try {
                    const res = await fetch(`https://api.pdfmonkey.io/api/v1/documents/${docId}`, {
                        headers: { "Authorization": `Bearer ${API_KEY}` }
                    });
                    const data = await res.json();
                    const doc = data.document;

                    if (doc.status === "success") {
                        if(btnElement) { 
                            btnElement.outerHTML = `<a href="${doc.download_url}" target="_blank" class="flex-1 md:flex-none text-center px-6 py-3 bg-[#238636] text-white font-black uppercase tracking-widest text-xs rounded hover:bg-[#2ea043] transition shadow-[0_4px_15px_rgba(35,134,54,0.3)] animate-pulse">✅ OPEN PDF DOSSIER</a>`;
                        }
                    } else if (doc.status === "draft" || doc.status === "pending" || doc.status === "generating") {
                        setTimeout(checkStatus, 1500); 
                    } else {
                        alert("PDF generation failed on the server.");
                        resetButton(btnElement);
                    }
                } catch (error) {
                    console.error("Polling error:", error);
                    resetButton(btnElement);
                }
            };
            checkStatus();
        }
    </script>
</body>
</html>
