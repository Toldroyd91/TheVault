<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COHI Dossier Compiler</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* BRAND STANDARDS & COLORS */
        :root { 
            --dark-blue: #0f3759; 
            --light-blue: rgba(1, 151, 217, 0.2);
            --font-heavy: 'Alerion', 'Arial Black', sans-serif;
            --font-light: 'Alerion', 'Arial', sans-serif;
        }

        body { background: #0d1117; color: #c9d1d9; font-family: var(--font-light); margin: 0; padding: 40px; }
        
        /* UI OVERLAY STYLES */
        .compiler-header { border-bottom: 1px solid #30363d; padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; color: #fff; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; font-family: var(--font-heavy); }
        .survey-card { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-pdf { background: var(--dark-blue); color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: var(--font-heavy); text-transform: uppercase;}
        .btn-pdf:hover { background: #0b2842; }

        /* --- STRICT A4 TEMPLATE ENGINE --- */
        #pdf-engine { display: none; }
        .pdf-page { width: 210mm; height: 297mm; position: relative; page-break-after: always; overflow: hidden; background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #fff; color: var(--dark-blue); }
        
        /* DYNAMIC LOGO PLACEMENT */
        .logo-center { position: absolute; top: 15mm; left: 50%; transform: translateX(-50%); width: 60mm; height: 20mm; object-fit: contain; }
        .logo-offset { position: absolute; top: 15mm; left: 33%; transform: translateX(-50%); width: 50mm; height: 18mm; object-fit: contain; } /* Centers within the 66% white column */

        /* DYNAMIC IMAGE COLUMNS */
        .side-img-right { position: absolute; top: 0; right: 0; width: 34%; height: 100%; background-size: cover; background-position: center; z-index: 1; }
        .side-img-left { position: absolute; top: 0; left: 0; width: 34%; height: 100%; background-size: cover; background-position: center; z-index: 1; }

        /* PAGE 1: COVER SPECIFICS */
        .map-diamond { position: absolute; top: 25%; left: 15%; width: 140mm; height: 140mm; background-size: cover; background-position: center; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); z-index: 2; border: 2px solid var(--dark-blue); }
        .cover-text-block { position: absolute; bottom: 25mm; right: 15mm; text-align: right; z-index: 3; color: var(--dark-blue); }
        .cover-name { font-family: var(--font-heavy); font-size: 52px; margin: 0; line-height: 1; text-transform: uppercase; }
        .cover-sub { font-family: var(--font-light); font-size: 22px; margin: 5px 0; }
        .cover-date { font-family: var(--font-light); font-size: 16px; opacity: 0.8; }

        /* EDITORIAL CONTENT CONTAINERS */
        .content-col-left { position: absolute; top: 40mm; left: 15mm; width: 120mm; height: 240mm; z-index: 5; }
        .content-col-right { position: absolute; top: 40mm; right: 15mm; width: 120mm; height: 240mm; z-index: 5; }
        
        .section-title { font-family: var(--font-heavy); font-size: 28px; text-transform: uppercase; margin-bottom: 20px; border-bottom: 2px solid var(--dark-blue); padding-bottom: 5px; }
        .data-group { margin-bottom: 15px; }
        .data-label { font-family: var(--font-heavy); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .data-value { font-family: var(--font-light); font-size: 18px; margin: 0; }
        .data-desc { font-family: var(--font-light); font-size: 11px; margin: 2px 0 0 0; opacity: 0.8; }

        /* TABLE OF CONTENTS */
        .toc-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; font-family: var(--font-light); font-size: 18px; }
        .toc-title { flex-grow: 1; text-align: right; padding-right: 10px; }
        .toc-page { font-family: var(--font-heavy); }

        /* BLUEPRINT ABSOLUTE COORDINATES */
        .bp-spec { position: absolute; font-family: var(--font-light); font-size: 16px; color: var(--dark-blue); z-index: 10; }
        .bp-roof { top: 26%; left: 8%; }
        .bp-frame { top: 22%; left: 42%; }
        .bp-dpc { top: 62%; left: 6%; }
        .bp-air { top: 76%; left: 8%; }
        .bp-dim { top: 67%; left: 24%; }
        .bp-mat { top: 60%; left: 45%; }
    </style>
</head>
<body>

    <div class="compiler-header">
        <div>
            <h1>COHI Dossier Compiler</h1>
            <p style="margin: 5px 0 0 0; font-size: 12px; color: #8b949e;">Rendering Engine Active</p>
        </div>
    </div>

    <div class="survey-list" id="surveyList">
        <p style="color: var(--light-blue); font-weight: bold;">Authenticating secure connection...</p>
    </div>

    <div id="pdf-engine">
        <div id="pdf-content"></div>
    </div>

    <script type="module">
        import { auth, db, collection, getDocs, doc, getDoc, onAuthStateChanged, functions } from './js/core-firebase.js';
        import { httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

        let surveysData = {};

        onAuthStateChanged(auth, async (user) => {
            await loadCompiler();
        });

        async function loadCompiler() {
            const list = document.getElementById('surveyList');
            try {
                const querySnapshot = await getDocs(collection(db, "surveys"));
                list.innerHTML = '';
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    surveysData[docSnap.id] = data;
                    list.innerHTML += `
                        <div class="survey-card">
                            <div>
                                <h3 style="margin:0; font-family: var(--font-heavy); color: #fff;">${data.customerProfile?.leadName || 'Unnamed Lead'}</h3>
                                <p style="margin:0; font-size: 12px; color: #8b949e;">${data.customerProfile?.postcode || 'No Postcode'} | ${data.projectSpecs?.buildType || 'TBC'}</p>
                            </div>
                            <button class="btn-pdf" onclick="generatePDF('${docSnap.id}', this)">Compile Report</button>
                        </div>
                    `;
                });
            } catch (error) {
                list.innerHTML = `<p style="color:red;">Database Connection Error: ${error.message}</p>`;
            }
        }

        window.generatePDF = async function(docId, btnElement) {
            if (btnElement) {
                btnElement.innerText = "Extracting & Rendering...";
                btnElement.disabled = true;
            }

            const data = surveysData[docId];
            const pdfContent = document.getElementById('pdf-content');
            
            // DYNAMIC VARIABLES
            const brandRaw = data.brand || 'Yorkshire Windows';
            const brandLogo = `assets/logos/${brandRaw.replace(/\s+/g, '').toLowerCase()}.png`; // e.g., assets/logos/yorkshirewindows.png
            const clientName = data.customerProfile?.leadName || 'Client';
            const dateStr = new Date().toLocaleDateString('en-GB');

            // API EXTRACTION
            let osMapUrl = "assets/background/map-fallback.jpg";
            let epcData = { area: "TBC", rating: "TBC", walls: "TBC", roof: "TBC" };

            try {
                const cleanPC = (data.customerProfile?.postcode || '').replace(/\s+/g, '');
                const houseNum = data.customerProfile?.houseNumber || "1";
                const pcRes = await fetch(`https://api.postcodes.io/postcodes/${cleanPC}`);
                const pcData = await pcRes.json();
                
                if(pcData.status === 200) {
                    const lat = pcData.result.latitude;
                    const lng = pcData.result.longitude;
                    
                    const fetchEPC = httpsCallable(functions, 'fetchEPCData');
                    const epcRes = await fetchEPC({ postcode: cleanPC, houseNum: houseNum });
                    if(epcRes.data?.success && epcRes.data?.data) {
                        epcData.area = `${epcRes.data.data['total-floor-area']} m²`;
                        epcData.rating = epcRes.data.data['current-energy-rating']?.toUpperCase() || "TBC";
                    }

                    const fetchOS = httpsCallable(functions, 'fetchOSMap');
                    const osRes = await fetchOS({ lat: lat, lng: lng });
                    if(osRes.data?.url) osMapUrl = osRes.data.url;
                }
            } catch(e) { console.warn("API Fetch bypassed."); }

            let html = '';

            // =========================================================
            // PAGE 1: COVER (bg-front.jpg)
            // =========================================================
            html += `
                <div class="pdf-page" style="background-image: url('asset/bg-front.jpg');">
                    <img src="${brandLogo}" class="logo-center" onerror="this.style.display='none'">
                    <div class="map-diamond" style="background-image: url('${osMapUrl}');"></div>
                    <div class="cover-text-block">
                        <h1 class="cover-name">${clientName}</h1>
                        <p class="cover-sub">Pre Design Survey Report</p>
                        <p class="cover-date">${dateStr}</p>
                    </div>
                </div>
            `;

            // =========================================================
            // PAGE 2: TOC (bg-left.jpg)
            // =========================================================
            html += `
                <div class="pdf-page" style="background-image: url('asset/bg-left.jpg');">
                    <img src="${brandLogo}" class="logo-offset" onerror="this.style.display='none'">
                    <div class="side-img-right" style="background-image: url('assets/background/lifestyle-1.jpg');"></div>
                    
                    <div class="content-col-left">
                        <h2 class="section-title">Table of Content</h2>
                        <div class="toc-row"><span class="toc-title">Meet Your Designer</span><span class="toc-page">3</span></div>
                        <div class="toc-row"><span class="toc-title">Project Information</span><span class="toc-page">4</span></div>
                        <div class="toc-row"><span class="toc-title">Site Intelligence</span><span class="toc-page">5</span></div>
                        <div class="toc-row"><span class="toc-title">Logistics & Compliance</span><span class="toc-page">6</span></div>
                    </div>
                </div>
            `;

            // =========================================================
            // PAGE 3: BLUEPRINT / PROJECT INFO (bg-proj.jpg)
            // =========================================================
            html += `
                <div class="pdf-page" style="background-image: url('asset/bg-proj.jpg');">
                    <img src="${brandLogo}" class="logo-offset" onerror="this.style.display='none'">
                    <div class="side-img-right" style="background-image: url('assets/background/conservatory-interior.jpg');"></div>
                    
                    <!-- ABSOLUTE COORDINATE INJECTIONS -->
                    <div class="bp-spec bp-roof">${data.projectSpecs?.roofStyle || 'TBC'}</div>
                    <div class="bp-spec bp-frame">${data.projectSpecs?.frameColour || 'TBC'}</div>
                    <div class="bp-spec bp-dpc">${data.designerInsights?.design?.includes('DPC Depth:') ? data.designerInsights.design.split('DPC Depth: ')[1].split('\\n')[0] : 'Standard'}</div>
                    <div class="bp-spec bp-air">${data.designerInsights?.design?.includes('Air Bricks:') ? data.designerInsights.design.split('Air Bricks: ')[1].split('\\n')[0] : 'None Required'}</div>
                    <div class="bp-spec bp-dim">${data.projectSpecs?.proposedSize || '0 x 0'}</div>
                    <div class="bp-spec bp-mat">${data.projectSpecs?.houseMaterial || 'TBC'}</div>
                </div>
            `;

            // =========================================================
            // PAGE 4: SITE INTELLIGENCE (bg-right.jpg)
            // =========================================================
            html += `
                <div class="pdf-page" style="background-image: url('asset/bg-right.jpg');">
                    <img src="${brandLogo}" class="logo-offset" style="left: 66%;" onerror="this.style.display='none'">
                    <div class="side-img-left" style="background-image: url('${data.media?.front || 'assets/background/exterior-1.jpg'}');"></div>
                    
                    <div class="content-col-right">
                        <h2 class="section-title">Site Intelligence</h2>
                        
                        <div class="data-group">
                            <div class="data-label">Property Profile</div>
                            <p class="data-value">${data.projectSpecs?.buildType || 'TBC'}</p>
                        </div>

                        <div class="data-group">
                            <div class="data-label">Existing Floor Area</div>
                            <p class="data-value">${epcData.area}</p>
                            <p class="data-desc">Registered Gov EPC Database</p>
                        </div>

                        <div class="data-group">
                            <div class="data-label">Energy Rating</div>
                            <p class="data-value">Band ${epcData.rating}</p>
                        </div>
                        
                        <div class="data-group" style="margin-top: 30px;">
                            <div class="data-label">Surveyor Field Notes</div>
                            <p class="data-desc" style="font-style: italic; font-size: 14px;">"${data.designerInsights?.prep || 'No structural anomalies recorded.'}"</p>
                        </div>
                    </div>
                </div>
            `;

            pdfContent.innerHTML = html;
            const element = document.getElementById('pdf-content');
            
            const opt = {
                margin:       0,
                filename:     `COHI_Dossier_${clientName.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            document.getElementById('pdf-engine').style.display = 'block';
            await new Promise(resolve => setTimeout(resolve, 800)); 
            
            try {
                await html2pdf().set(opt).from(element).save();
            } catch (err) {
                alert("PDF Generation Error: " + err.message);
            } finally {
                document.getElementById('pdf-engine').style.display = 'none';
                if (btnElement) {
                    btnElement.innerText = "Compile Report";
                    btnElement.disabled = false;
                }
            }
        };
    </script>
</body>
</html>
