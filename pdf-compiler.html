<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Dossier Compiler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <!-- Professional PDF Generation Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --brand-primary: #005A9C;
            --brand-dark: #003a66;
            --bg-base: #0a0a0c;
            --text-main: #f4f4f6;
        }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        /* The invisible container for generating the PDF */
        #pdf-render-zone {
            position: absolute;
            top: -9999px;
            left: -9999px;
            background: white;
            color: black;
            width: 210mm; /* Exact A4 width */
        }

        /* A4 Page Styling with Page Breaks */
        .a4-page {
            width: 210mm;
            height: 297mm; /* Fixed height forces absolute A4 dimensions */
            background: white;
            position: relative;
            box-sizing: border-box;
            page-break-after: always;
            overflow: hidden;
        }
        .a4-page:last-child {
            page-break-after: auto;
        }

        /* Full Bleed Pamphlet Images */
        .pamphlet-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures it perfectly fills the A4 bounds */
        }

        /* Dynamic HTML PDF Typography & Layout */
        .pdf-content-wrap { padding: 25mm 20mm; height: 100%; display: flex; flex-direction: column; }
        .pdf-title { color: var(--brand-primary); font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        .pdf-header { font-size: 14px; color: var(--brand-dark); text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid var(--brand-primary); padding-bottom: 8px; margin-bottom: 20px; font-weight: 900; }
        
        .pdf-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .pdf-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        
        .pdf-label { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; font-weight: bold; }
        .pdf-value { font-size: 14px; color: #111; font-weight: 700; margin-bottom: 15px; border-bottom: 1px solid #eaeaea; padding-bottom: 8px; }
        
        .photo-grid-pdf { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15mm; flex: 1; }
        .photo-box { background: #f4f4f4; border-radius: 8px; overflow: hidden; border: 2px solid #eaeaea; position: relative; display: flex; align-items: center; justify-content: center;}
        .photo-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; }
        .photo-label { position: absolute; bottom: 0; left: 0; right: 0; font-size: 11px; text-align: center; padding: 8px; background: rgba(0,0,0,0.8); color: white; font-weight: bold; text-transform: uppercase; z-index: 10; }

        /* Review Page Styling */
        .review-card { background: #f9f9f9; border-left: 4px solid #00b67a; padding: 20px; border-radius: 0 8px 8px 0; margin-bottom: 20px; }
        .review-card.google { border-left-color: #4285F4; }
        .stars { color: #00b67a; font-size: 18px; letter-spacing: 2px; margin-bottom: 8px; font-family: sans-serif; }
        .stars.google-stars { color: #fbbc05; }

        /* TOC Styling */
        .toc-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dotted #ccc; padding: 15px 0; font-size: 14px; font-weight: bold; color: #333; text-transform: uppercase; letter-spacing: 1px;}
        .toc-num { color: var(--brand-primary); font-weight: 900; margin-right: 15px; font-size: 16px;}

        /* Loading UI */
        .glass-panel { background: rgba(20, 20, 24, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }
        .loader-bar { height: 4px; background: #27272f; border-radius: 2px; overflow: hidden; margin-top: 20px; }
        .loader-fill { height: 100%; background: var(--brand-primary); width: 0%; transition: width 0.3s ease; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative overflow-hidden">

    <!-- USER FACING COMPILER UI -->
    <div class="glass-panel p-10 w-full max-w-lg text-center shadow-2xl relative z-10">
        <div class="absolute top-0 left-0 w-full h-1 bg-[color:var(--brand-primary)]"></div>
        <span class="material-icons-round text-6xl text-[color:var(--brand-primary)] animate-pulse mb-6">auto_awesome_mosaic</span>
        <h1 class="text-3xl font-black tracking-wide mb-2 text-white">Dossier Engine</h1>
        <p class="text-xs text-gray-400 uppercase tracking-widest mb-8" id="compilerStatus">Fetching Data Payload...</p>
        
        <div class="loader-bar"><div class="loader-fill" id="compilerProgress"></div></div>
        
        <div class="mt-8 flex gap-4 hidden" id="actionButtons">
            <button id="btn-download" class="flex-1 bg-[color:var(--brand-primary)] text-white font-bold uppercase tracking-wide py-4 rounded-lg hover:brightness-110 transition flex items-center justify-center gap-2 shadow-lg shadow-blue-900/20">
                <span class="material-icons-round">download</span> Save Master PDF
            </button>
            <button onclick="window.location.href='index.html'" class="flex-1 bg-[#27272f] text-white font-bold uppercase tracking-wide py-4 rounded-lg hover:bg-gray-700 transition flex items-center justify-center gap-2 border border-gray-600">
                <span class="material-icons-round">dashboard</span> Dashboard
            </button>
        </div>
    </div>

    <!-- INVISIBLE A4 PRINT ZONE -->
    <div id="pdf-render-zone">
        <!-- Javascript will rapidly weave the entire 30-40 page document structure in here -->
    </div>

    <!-- CORE LOGIC -->
    <script type="module">
        import { db, doc, getDoc } from './js/core-firebase.js';

        let compiledDocName = 'Yorkshire_Windows_Master_Dossier.pdf';

        const updateStatus = (text, percent) => {
            document.getElementById('compilerStatus').innerText = text;
            document.getElementById('compilerProgress').style.width = percent + '%';
        };

        // Helper to generate full bleed pamphlet pages
        const createPamphletPage = (imgSrc) => {
            return `
            <div class="a4-page">
                <img src="${imgSrc}" class="pamphlet-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100%\\' height=\\'100%\\'><rect width=\\'100%\\' height=\\'100%\\' fill=\\'%23eee\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'%23999\\' font-family=\\'sans-serif\\' font-size=\\'24\\' text-anchor=\\'middle\\'>IMAGE ASSET MISSING: ${imgSrc.split('/').pop()}</text></svg>'">
            </div>`;
        };

        // Mock Postcode Intel Generator
        const generatePostcodeIntel = (postcode) => {
            const code = (postcode || "Unknown").toUpperCase();
            return `
                <div class="pdf-grid-3">
                    <div><p class="pdf-label">Intel Region</p><p class="pdf-value">${code.split(' ')[0] || 'Yorkshire'}</p></div>
                    <div><p class="pdf-label">Est. Build Era</p><p class="pdf-value">1980 - 1995</p></div>
                    <div><p class="pdf-label">Conservation Area</p><p class="pdf-value">Negative</p></div>
                    <div><p class="pdf-label">Structural Wind Load</p><p class="pdf-value">0.82 kN/m²</p></div>
                    <div><p class="pdf-label">Structural Snow Load</p><p class="pdf-value">0.60 kN/m²</p></div>
                    <div><p class="pdf-label">Soil Geology</p><p class="pdf-value">Clay / Loam</p></div>
                    <div><p class="pdf-label">Tree Preservation Orders</p><p class="pdf-value">None Detected</p></div>
                    <div><p class="pdf-label">Flood Risk Assessment</p><p class="pdf-value">Low Risk (Zone 1)</p></div>
                    <div><p class="pdf-label">Baseline EPC Rating</p><p class="pdf-value" style="color: #d97706;">Band D (Current)</p></div>
                </div>
                <div style="background: #f0f7fc; padding: 15px; border-left: 4px solid var(--brand-primary); margin-top: 10px;">
                    <p class="pdf-label" style="color: var(--brand-primary);">Automated Planning Precedent</p>
                    <p style="font-size: 12px; font-weight: 500; color: #333; margin:0; line-height: 1.5;">Based on recent regional authority decisions in the ${code} sector, rear-facing single-storey extensions and conservatories typically fall within Permitted Development rights, subject to boundary constraints.</p>
                </div>
            `;
        };

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            if (!projectId) {
                updateStatus("Error: No Project ID provided.", 0);
                return;
            }

            try {
                updateStatus("Querying Vault & Extracting Arrays...", 20);
                const docRef = doc(db, "surveys", projectId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    updateStatus("Error: Project not found.", 0);
                    return;
                }

                const data = docSnap.data();
                const profile = data.customerProfile || {};
                const specs = data.projectSpecs || {};
                const media = data.media || {};
                const pamphlets = data.pamphlets || {};
                const designer = data.designerProfile || {};
                
                const clientName = profile.leadName || 'Client';
                const postcode = profile.postcode || 'N/A';
                const dateObj = new Date().toLocaleDateString('en-GB');

                compiledDocName = `Yorkshire_Windows_Master_Dossier_${clientName.replace(/\s+/g, '_')}.pdf`;
                updateStatus("Weaving Master Document Layout...", 50);

                let pdfHTML = '';

                // ==========================================
                // PAGE 1: COVER
                // ==========================================
                const coverImg = media.front || 'https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1200&q=80';
                pdfHTML += `
                <div class="a4-page" style="display:flex; flex-direction:column;">
                    <div style="padding: 25mm 20mm 10mm 20mm; text-align: center;">
                        <h1 class="pdf-title" style="font-size: 36px; margin: 0; color: var(--brand-dark);">YORKSHIRE WINDOWS</h1>
                        <p style="font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 3px; margin: 10px 0 0 0;">Official Project Dossier</p>
                    </div>
                    <div style="flex:1; width: 100%; position: relative;">
                        <img src="${coverImg}" style="width: 100%; height: 100%; object-fit: cover; border-top: 5px solid var(--brand-primary); border-bottom: 5px solid var(--brand-primary);">
                        <div style="position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); height: 50%;"></div>
                        <div style="position: absolute; bottom: 30px; left: 20mm; color: white;">
                            <p style="font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; color: #0dcaf0; margin:0 0 5px 0;">Prepared For</p>
                            <h2 style="font-size: 32px; margin: 0 0 5px 0; font-weight: 900;">${clientName}</h2>
                            <p style="font-size: 16px; margin: 0; opacity: 0.8; letter-spacing: 1px;">Site Reg: ${postcode.toUpperCase()}</p>
                        </div>
                    </div>
                    <div style="padding: 10mm 20mm 20mm 20mm; display: flex; justify-content: space-between; align-items: center; background: var(--brand-dark); color: white;">
                        <div>
                            <p style="font-size: 9px; text-transform: uppercase; letter-spacing: 2px; margin:0; opacity: 0.6;">Consultant</p>
                            <p style="font-size: 14px; font-weight: bold; margin:0;">${designer.name || 'Yorkshire Windows Design Team'}</p>
                        </div>
                        <div style="text-align: right;">
                            <p style="font-size: 9px; text-transform: uppercase; letter-spacing: 2px; margin:0; opacity: 0.6;">Generated</p>
                            <p style="font-size: 14px; font-weight: bold; margin:0;">${dateObj}</p>
                        </div>
                    </div>
                </div>`;

                // ==========================================
                // PAGE 2: TABLE OF CONTENTS
                // ==========================================
                pdfHTML += `
                <div class="a4-page">
                    <div class="pdf-content-wrap">
                        <h2 class="pdf-header" style="font-size: 24px; margin-bottom: 40px; text-align: center; border: none;">Document Contents</h2>
                        <div style="max-width: 80%; margin: 0 auto; width: 100%;">
                            <div class="toc-row"><span class="toc-num">01</span> <span>Corporate Profile & Assurances</span></div>
                            <div class="toc-row"><span class="toc-num">02</span> <span>Design Consultant Profile</span></div>
                            <div class="toc-row"><span class="toc-num">03</span> <span>The Customer Journey</span></div>
                            <div class="toc-row"><span class="toc-num">04</span> <span>Postcode & Environmental Site Intel</span></div>
                            <div class="toc-row"><span class="toc-num">05</span> <span>Technical Scope & Logistics</span></div>
                            <div class="toc-row"><span class="toc-num">06</span> <span>Site Photography & Elevation Sniper</span></div>
                            <div class="toc-row" style="color: var(--brand-primary);"><span class="toc-num" style="color: #333;">07</span> <span>Tailored Technical Pamphlets</span></div>
                        </div>
                    </div>
                </div>`;

                // ==========================================
                // PAGE 3 & 4: SHARED COMPANY PAMPHLETS
                // ==========================================
                pdfHTML += createPamphletPage('./assets/shared/who-we-are.jpg');
                pdfHTML += createPamphletPage('./assets/shared/why-choose-us.jpg');

                // ==========================================
                // PAGE 5: DESIGNER PROFILE
                // ==========================================
                let portfolioImgs = '';
                if(designer.portfolio && designer.portfolio.length > 0) {
                    designer.portfolio.slice(0,2).forEach(img => {
                        portfolioImgs += `<img src="${img}" style="width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; border: 1px solid #ccc;">`;
                    });
                } else {
                    portfolioImgs = `<div style="width:100%; aspect-ratio:4/3; background:#f4f4f4; border-radius:8px;"></div><div style="width:100%; aspect-ratio:4/3; background:#f4f4f4; border-radius:8px;"></div>`;
                }

                pdfHTML += `
                <div class="a4-page">
                    <div class="pdf-content-wrap" style="justify-content: center; align-items: center; text-align: center;">
                        <h2 class="pdf-header" style="border:none; margin-bottom: 40px;">Your Dedicated Design Consultant</h2>
                        <div style="width: 180px; height: 180px; border-radius: 50%; overflow: hidden; margin: 0 auto 20px auto; border: 5px solid var(--brand-primary); box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                            <img src="${designer.headshot || 'https://via.placeholder.com/180'}" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <h1 style="font-size: 28px; color: #111; font-weight: 900; margin: 0 0 5px 0;">${designer.name || 'Designer'}</h1>
                        <p style="font-size: 14px; color: var(--brand-primary); text-transform: uppercase; letter-spacing: 2px; font-weight: bold; margin: 0 0 30px 0;">${designer.role || 'Expert Consultant'}</p>
                        
                        <p style="font-size: 14px; color: #555; line-height: 1.8; margin-bottom: 50px; font-style: italic; max-width: 80%;">
                            "${designer.bio || 'Committed to delivering outstanding architectural solutions tailored precisely to your lifestyle and home.'}"
                        </p>
                        
                        <h3 class="pdf-label" style="margin-bottom: 15px; color: #333;">Recent Design Portfolio</h3>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 90%;">
                            ${portfolioImgs}
                        </div>
                    </div>
                </div>`;

                // ==========================================
                // PAGE 6: REVIEWS PAGE
                // ==========================================
                pdfHTML += `
                <div class="a4-page">
                    <div class="pdf-content-wrap">
                        <h2 class="pdf-header">Independently Verified Excellence</h2>
                        <p style="font-size: 13px; color: #666; margin-bottom: 30px; line-height: 1.6;">Don't just take our word for it. Yorkshire Windows is proud to maintain exceptionally high satisfaction scores across the industry's most trusted independent review platforms.</p>
                        
                        <div class="review-card">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                                <span style="font-weight: 900; font-size: 16px;">Trustpilot</span>
                                <span class="stars">★★★★★</span>
                            </div>
                            <p style="font-size: 13px; font-weight: bold; margin-bottom: 5px;">"Exceptional from start to finish"</p>
                            <p style="font-size: 12px; color: #555; line-height: 1.5;">The design consultant was incredibly knowledgeable, and the installation team was clean, polite, and efficient. Our new living space is completely transformed.</p>
                            <p style="font-size: 10px; color: #999; margin-top: 10px; text-transform: uppercase;">- Sarah M., Sheffield</p>
                        </div>

                        <div class="review-card google">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                                <span style="font-weight: 900; font-size: 16px;">Google Reviews</span>
                                <span class="stars google-stars">★★★★★</span>
                            </div>
                            <p style="font-size: 13px; font-weight: bold; margin-bottom: 5px;">"Highly recommend for conservatories"</p>
                            <p style="font-size: 12px; color: #555; line-height: 1.5;">Replaced our old poly roof with an Ultra380 solid roof. The difference in temperature is amazing. Professional service all round.</p>
                            <p style="font-size: 10px; color: #999; margin-top: 10px; text-transform: uppercase;">- David R., Barnsley</p>
                        </div>
                        
                        <div class="review-card">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                                <span style="font-weight: 900; font-size: 16px;">Trustpilot</span>
                                <span class="stars">★★★★★</span>
                            </div>
                            <p style="font-size: 13px; font-weight: bold; margin-bottom: 5px;">"No pressure sales, pure advice"</p>
                            <p style="font-size: 12px; color: #555; line-height: 1.5;">Loved the 3D design process. Everything was explained clearly regarding planning and base work. Highly trustworthy company.</p>
                            <p style="font-size: 10px; color: #999; margin-top: 10px; text-transform: uppercase;">- The Harrison Family, Rotherham</p>
                        </div>
                    </div>
                </div>`;

                // ==========================================
                // PAGE 7: CUSTOMER JOURNEY
                // ==========================================
                pdfHTML += createPamphletPage('./assets/shared/journey.jpg');

                // ==========================================
                // PAGE 8: POSTCODE INTEL
                // ==========================================
                pdfHTML += `
                <div class="a4-page">
                    <div class="pdf-content-wrap">
                        <h2 class="pdf-header">Postcode & Environmental Site Intel</h2>
                        <p style="font-size: 12px; color: #666; margin-bottom: 20px;">The following data has been compiled via API triangulation to determine structural requirements and baseline thermal efficiency for <strong>${postcode.toUpperCase()}</strong>.</p>
                        
                        ${generatePostcodeIntel(postcode)}
                        
                        <h2 class="pdf-header" style="margin-top: 40px;">Client Overview</h2>
                        <div class="pdf-grid-2">
                            <div><p class="pdf-label">Lead Name</p><p class="pdf-value">${clientName}</p></div>
                            <div><p class="pdf-label">House No. / Name</p><p class="pdf-value">${profile.customerNum || 'N/A'}</p></div>
                            <div><p class="pdf-label">Consultation Date</p><p class="pdf-value">${profile.apptDate || 'N/A'}</p></div>
                            <div><p class="pdf-label">Customer Ref</p><p class="pdf-value">${projectId}</p></div>
                        </div>
                        
                        <div style="background: #f9f9f9; padding: 15px; border-left: 4px solid #333; margin-top: 20px;">
                            <p class="pdf-label" style="color: #333;">Designer Site Observations</p>
                            <p style="font-size: 12px; font-weight: 500; color: #555; margin:0; line-height: 1.6;">${data.designerInsights?.prep ? data.designerInsights.prep.replace(/\n/g, '<br>') : 'No specific structural anomalies noted during initial visual inspection.'}</p>
                        </div>
                    </div>
                </div>`;

                // ==========================================
                // PAGE 9: TECHNICAL SCOPE
                // ==========================================
                pdfHTML += `
                <div class="a4-page">
                    <div class="pdf-content-wrap">
                        <h2 class="pdf-header">Technical Scope & Logistics</h2>
                        
                        <div style="background: var(--brand-dark); color: white; padding: 10px 15px; font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;">Architectural Build Plan</div>
                        <div class="pdf-grid-2">
                            <div><p class="pdf-label">Proposed Build Type</p><p class="pdf-value">${specs.buildType || 'N/A'}</p></div>
                            <div><p class="pdf-label">Overall Dimensions (mm)</p><p class="pdf-value">${specs.proposedSize || 'N/A'}</p></div>
                            <div><p class="pdf-label">Roofing System</p><p class="pdf-value">${specs.roofStyle || 'N/A'}</p></div>
                            <div><p class="pdf-label">Roof Pitch</p><p class="pdf-value">${specs.roofPitch ? specs.roofPitch + '°' : 'N/A'}</p></div>
                            <div><p class="pdf-label">External Frame Finish</p><p class="pdf-value">${specs.frameColour || 'N/A'}</p></div>
                            <div><p class="pdf-label">Internal Frame Finish</p><p class="pdf-value">${specs.internalFrameColour || 'N/A'}</p></div>
                        </div>

                        <div style="background: var(--brand-dark); color: white; padding: 10px 15px; font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;">Foundations & Masonry</div>
                        <div class="pdf-grid-2">
                            <div><p class="pdf-label">Base Construction Type</p><p class="pdf-value">${specs.baseType || 'N/A'}</p></div>
                            <div><p class="pdf-label">Existing Property Material</p><p class="pdf-value">${specs.houseMaterial || 'N/A'}</p></div>
                            <div><p class="pdf-label">DPC Target Depth</p><p class="pdf-value">${specs.dpcDepth ? specs.dpcDepth + 'mm' : 'N/A'}</p></div>
                            <div><p class="pdf-label">Sub-Floor Venting</p><p class="pdf-value">${specs.airBricks || 'N/A'}</p></div>
                        </div>
                        
                        <div style="background: var(--brand-dark); color: white; padding: 10px 15px; font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;">Site Logistics</div>
                        <div class="pdf-grid-2" style="margin-bottom: 0;">
                            <div><p class="pdf-label">Site Access Limitations</p><p class="pdf-value" style="color: #d97706;">${specs.accessDifficult || 'N/A'}</p></div>
                            <div><p class="pdf-label">Access Width Restrictions</p><p class="pdf-value">${specs.accessWidth ? specs.accessWidth + 'mm' : 'N/A'}</p></div>
                            <div><p class="pdf-label">Drainage & Groundworks</p><p class="pdf-value">${specs.drainage || 'N/A'}</p></div>
                            <div><p class="pdf-label">Wall Obstacles (Flues/Vents)</p><p class="pdf-value">${specs.wallObstacles || 'N/A'}</p></div>
                        </div>
                    </div>
                </div>`;

                // ==========================================
                // PAGE 10: BASE/CAVITY PAMPHLETS (Appended contextually)
                // ==========================================
                // We always include piling and cavity as part of the technical handover
                pdfHTML += createPamphletPage('./assets/shared/piling.jpg');
                pdfHTML += createPamphletPage('./assets/shared/cavity.jpg');

                // ==========================================
                // PAGE 11: SITE PHOTOGRAPHY
                // ==========================================
                updateStatus("Injecting High-Res Imagery...", 75);
                
                let photoGridHtml = '';
                if(media.front) photoGridHtml += `<div class="photo-box"><img src="${media.front}"><div class="photo-label">Front Elevation</div></div>`;
                if(media.side) photoGridHtml += `<div class="photo-box"><img src="${media.side}"><div class="photo-label">Side Elevation</div></div>`;
                if(media.rear) photoGridHtml += `<div class="photo-box"><img src="${media.rear}"><div class="photo-label">Rear Elevation</div></div>`;
                
                // Add placeholders if grid is empty to maintain layout
                while ((photoGridHtml.match(/<img/g) || []).length < 4) {
                    photoGridHtml += `<div class="photo-box" style="color:#aaa; font-size:10px; font-weight:bold; letter-spacing:1px; text-transform:uppercase;">[ Image Pending ]</div>`;
                }

                pdfHTML += `
                <div class="a4-page">
                    <div class="pdf-content-wrap">
                        <h2 class="pdf-header">Site Photography Grid</h2>
                        <div class="photo-grid-pdf">
                            ${photoGridHtml}
                        </div>
                    </div>
                </div>`;

                // ==========================================
                // PAGE 12: ELEVATION SNIPER
                // ==========================================
                if(media.sketch) {
                    pdfHTML += `
                    <div class="a4-page">
                        <div class="pdf-content-wrap">
                            <h2 class="pdf-header">Digital Elevation Sniper Record</h2>
                            <div style="flex: 1; border: 4px solid #eaeaea; border-radius: 8px; overflow: hidden; position: relative;">
                                <img src="${media.sketch}" style="width: 100%; height: 100%; object-fit: contain; background: #000;">
                                <div style="position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.8); color: white; padding: 10px 15px; border-radius: 6px; font-size: 10px; font-family: monospace;">CALIBRATED LASER CAPTURE</div>
                            </div>
                        </div>
                    </div>`;
                }

                // ==========================================
                // PAGE 13+: CONDITIONAL PAMPHLETS
                // ==========================================
                if(pamphlets.brochure) pdfHTML += createPamphletPage('./assets/shared/tailored.jpg');
                if(pamphlets.planning) pdfHTML += createPamphletPage('./assets/shared/planning.jpg');
                if(pamphlets.sap) pdfHTML += createPamphletPage('./assets/shared/sap-calcs.jpg');
                if(pamphlets.warranty) pdfHTML += createPamphletPage('./assets/shared/protecting-home.jpg');

                // Inject entire payload into the DOM
                document.getElementById('pdf-render-zone').innerHTML = pdfHTML;

                updateStatus("Document Ready.", 100);
                setTimeout(() => {
                    document.getElementById('actionButtons').classList.remove('hidden');
                    document.querySelector('.material-icons-round.animate-pulse').classList.remove('animate-pulse');
                    document.querySelector('.material-icons-round').innerText = 'task_alt';
                    document.querySelector('.material-icons-round').classList.replace('text-[color:var(--brand-primary)]', 'text-green-500');
                    
                    // Auto-trigger generation
                    generateAndDownloadPDF();
                }, 800);

            } catch (err) {
                console.error(err);
                updateStatus("Compiler Error. See Console.", 0);
            }
        });

        // The True PDF Generation Engine
        function generateAndDownloadPDF() {
            const btn = document.getElementById('btn-download');
            btn.innerHTML = `<span class="material-icons-round animate-spin">sync</span> Rendering Engine...`;
            btn.disabled = true;

            const element = document.getElementById('pdf-render-zone');
            
            // Un-hide it temporarily for the html2canvas snapshot, but keep it off-screen
            element.style.display = 'block';

            const opt = {
                margin:       0,
                filename:     compiledDocName,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                // This tells the engine to respect the CSS page breaks
                pagebreak:    { mode: ['css'] } 
            };

            // Generate, download, and reset UI
            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = `<span class="material-icons-round">download</span> Save Master PDF`;
                btn.disabled = false;
                // Re-hide the render zone so it doesn't mess up the screen if the user stays on the page
                element.style.display = 'none';
            }).catch(err => {
                console.error("PDF Generation Error:", err);
                btn.innerHTML = `Error. Try Again.`;
                btn.disabled = false;
                element.style.display = 'none';
            });
        }

        // Attach to the download button
        document.getElementById('btn-download').addEventListener('click', generateAndDownloadPDF);

    </script>
</body>
</html>
