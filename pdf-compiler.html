<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Survey Compiler</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #E50914; --text: #c9d1d9; --border: #30363d; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 40px; }
        
        .compiler-header { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; color: #fff; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; }
        
        .survey-list { display: grid; gap: 15px; max-width: 800px; }
        .survey-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .client-info h3 { margin: 0 0 5px 0; color: #fff; font-size: 16px; }
        .client-info p { margin: 0; font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn-pdf { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; transition: 0.2s; }
        .btn-pdf:hover { background: #b20710; }
        .btn-pdf:disabled { background: #444; cursor: not-allowed; }

        /* LOADING SPINNER FOR AUTO-TRIGGER */
        .loading-overlay { display: none; text-align: center; padding: 40px; background: var(--card); border-radius: 8px; border: 1px solid var(--border-color); }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--accent); animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- STRICT A4 PRINT TEMPLATE (Hidden from UI) --- */
        #pdf-engine { display: none; }
        .pdf-page { width: 210mm; min-height: 297mm; background: #fff; color: #000; padding: 20mm; box-sizing: border-box; font-family: 'Helvetica', sans-serif; position: relative; page-break-after: always; overflow: hidden;}
        
        /* DYNAMIC WATERMARK */
        .pdf-watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-35deg); font-size: 120px; color: rgba(0,0,0,0.02); font-weight: 900; white-space: nowrap; pointer-events: none; z-index: 0; text-align: center; width: 200%; line-height: 1; letter-spacing: -2px;}
        
        .pdf-content-wrapper { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column;}
        
        .pdf-header { border-bottom: 3px solid #E50914; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;}
        .pdf-title { font-size: 28px; font-weight: 900; margin: 0; color: #000; text-transform: uppercase; letter-spacing: -1px; line-height: 1;}
        .pdf-subtitle { font-size: 10px; color: #666; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px;}
        .pdf-meta-right { text-align: right; font-size: 9px; color: #666; text-transform: uppercase; }
        
        .section-title { background: #000; color: #fff; padding: 10px 15px; font-size: 13px; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; }
        
        .pdf-grid { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
        .pdf-box { border: 1px solid #ddd; padding: 15px; flex: 1; min-width: 45%; background: rgba(255,255,255,0.9); border-left: 4px solid #000; }
        .pdf-box.highlight { border-left-color: #E50914; background: rgba(229,9,20,0.03); }
        .pdf-box.full-width { min-width: 100%; }
        .pdf-label { font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: 8px; display: block; font-weight: bold; letter-spacing: 1px; }
        .pdf-val { font-size: 15px; font-weight: bold; color: #000; margin: 0 0 5px 0; }
        .pdf-desc { font-size: 11px; color: #444; line-height: 1.5; margin: 0; }
        .pdf-math { font-family: monospace; background: #eee; padding: 4px 8px; font-size: 10px; border-radius: 4px; display: inline-block; margin-top: 5px; color: #333; border: 1px solid #ccc;}
        
        .pdf-image-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .pdf-img-container { border: 1px solid #ccc; padding: 5px; text-align: center; height: 260px; background: #fff; }
        /* Notice the object-fit is contain to prevent distortion on weird crops */
        .pdf-img-container img { width: 100%; height: 100%; object-fit: contain; }
        .pdf-img-title { font-size: 9px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; background: #000; color: #fff; padding: 6px; letter-spacing: 1px;}
        
        /* TOC STYLES */
        .toc-row { display: flex; align-items: baseline; margin-bottom: 15px; border-bottom: 1px dotted #ccc; padding-bottom: 5px;}
        .toc-num { font-size: 18px; font-weight: 900; color: #E50914; margin-right: 15px; }
        .toc-text { font-size: 14px; font-weight: bold; color: #000; text-transform: uppercase; flex-grow: 1;}
        
        /* GLOSSARY STYLES */
        .glossary-item { margin-bottom: 15px; }
        .glossary-term { font-size: 12px; font-weight: bold; color: #E50914; text-transform: uppercase; margin-bottom: 3px; display: block;}
        .glossary-def { font-size: 11px; color: #333; line-height: 1.5; margin: 0;}

        /* PAMPHLET COVER STYLES */
        .pamphlet-cover { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 4px solid #000; padding: 40px;}
        .pamphlet-icon { font-size: 60px; margin-bottom: 20px;}
        .pamphlet-title { font-size: 32px; font-weight: 900; text-transform: uppercase; margin-bottom: 10px;}
        
        .pdf-citation { font-size: 8px; color: #666; text-align: left; border-top: 1px solid #eee; padding-top: 10px; margin-top: auto; line-height: 1.4;}
    </style>
</head>
<body>

    <div class="compiler-header">
        <div>
            <h1>PDF Compiler Engine</h1>
            <p style="margin: 5px 0 0 0; font-size: 12px; color: #8b949e;">Strict Factual & Financial Document Generation Utility</p>
        </div>
        <button onclick="window.location.href='dashboard.html'" style="background: transparent; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 15px; border-radius: 4px; cursor: pointer;">Return to Dashboard</button>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <h3 style="color: #fff; margin:0;">Compiling Architectural Dossier</h3>
        <p id="loadingStatus" style="color: #8b949e; font-size: 12px; margin-top: 10px;">Establishing secure database connection...</p>
    </div>

    <div class="survey-list" id="surveyList">
        <p>Loading database records...</p>
    </div>

    <div id="pdf-engine">
        <div id="pdf-content"></div>
    </div>

    <script type="module">
        import { db, collection, getDocs, doc, getDoc } from './js/core-firebase.js';

        let surveysData = {};

        async function loadCompiler() {
            const list = document.getElementById('surveyList');
            const urlId = new URLSearchParams(window.location.search).get('id');

            // AUTO-TRIGGER LOGIC: If an ID was passed from survey.html, skip the list and build it
            if (urlId) {
                list.style.display = 'none';
                document.getElementById('loadingOverlay').style.display = 'block';
                
                try {
                    document.getElementById('loadingStatus').innerText = "Fetching survey payload...";
                    const snap = await getDoc(doc(db, "surveys", urlId));
                    
                    if (snap.exists()) {
                        surveysData[urlId] = snap.data();
                        document.getElementById('loadingStatus').innerText = "Calculating structural yields...";
                        await generatePDF(urlId, null); // Call generator
                        document.getElementById('loadingStatus').innerText = "Download Complete. You may return to the Dashboard.";
                        document.querySelector('.spinner').style.display = 'none';
                    } else {
                        document.getElementById('loadingStatus').innerText = "Survey not found in database.";
                        document.getElementById('loadingStatus').style.color = "red";
                        document.querySelector('.spinner').style.display = 'none';
                    }
                } catch (e) {
                    document.getElementById('loadingStatus').innerText = "Connection Error: " + e.message;
                    document.getElementById('loadingStatus').style.color = "red";
                    document.querySelector('.spinner').style.display = 'none';
                }
                return; // Stop execution so the list doesn't load
            }

            // STANDARD LIST LOAD (If arriving from Dashboard)
            try {
                const querySnapshot = await getDocs(collection(db, "surveys"));
                list.innerHTML = '';
                
                if(querySnapshot.empty) {
                    list.innerHTML = '<p>No survey records found.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    surveysData[doc.id] = data;
                    
                    const name = data.customerProfile?.leadName || 'Unnamed Lead';
                    const postcode = data.customerProfile?.postcode || 'No Postcode';
                    const buildType = data.projectSpecs?.buildType || 'TBC';

                    list.innerHTML += `
                        <div class="survey-card">
                            <div class="client-info">
                                <h3>${name}</h3>
                                <p>${postcode} | ${buildType}</p>
                            </div>
                            <button class="btn-pdf" onclick="generatePDF('${doc.id}', this)">Compile Master Report</button>
                        </div>
                    `;
                });
            } catch (error) {
                list.innerHTML = `<p style="color: red;">Connection Error: ${error.message}</p>`;
            }
        }

        window.generatePDF = async function(docId, btnElement) {
            let originalText = "Compile Master Report";
            if (btnElement) {
                originalText = btnElement.innerText;
                btnElement.innerText = "Extracting Data & Calculating Yields...";
                btnElement.disabled = true;
            }

            const data = surveysData[docId];
            const pdfContent = document.getElementById('pdf-content');
            
            const brandRaw = data.brand || 'CO HOME IMPROVEMENTS';
            const brandName = brandRaw.replace(/([A-Z])/g, ' $1').trim().toUpperCase();
            
            const postcode = data.customerProfile?.postcode || 'TBC';
            const rawSize = data.projectSpecs?.proposedSize || '0x0';
            const buildType = data.projectSpecs?.buildType || 'TBC';
            const roofStyle = data.projectSpecs?.roofStyle || 'TBC';
            const dateStr = new Date().toLocaleDateString('en-GB');

            // --- 1. SPATIAL & FINANCIAL MATHEMATICS ---
            let sqMetres = 0;
            const sizeMatch = rawSize.match(/(\d+)\s*x\s*(\d+)/i);
            if(sizeMatch) {
                const widthM = parseInt(sizeMatch[1]) / 1000;
                const lengthM = parseInt(sizeMatch[2]) / 1000;
                sqMetres = (widthM * lengthM).toFixed(2);
            }

            const pricePerSqm = 2400; // Regional average
            const consYieldPercent = 5;
            let roiTitle = "Estimated Equity Yield";
            let roiVal = "Data Unavailable";
            let roiDesc = "Dimension format requires manual assessment.";
            let roiMath = "";

            if(sqMetres > 0) {
                if(buildType.toLowerCase().includes('conservatory')) {
                    roiVal = `Est. ${consYieldPercent}% Property Uplift`;
                    roiDesc = `Conservatory additions are indexed to provide a percentage yield against the total existing property value.`;
                    roiMath = `Calculation: Existing Property Value × 0.05`;
                } else {
                    const addedValue = (sqMetres * pricePerSqm).toLocaleString('en-GB');
                    roiVal = `Est. £${addedValue} Valuation Uplift`;
                    roiDesc = `Yield is calculated by multiplying the new internal spatial footprint by the current regional property index value per square meter.`;
                    roiMath = `Formula: ${sqMetres}m² × £${pricePerSqm.toLocaleString('en-GB')}/m² = £${addedValue}`;
                }
            }

            // --- 2. METEOROLOGICAL API DATA ---
            let elevation = "Pending API";
            let district = "Local Authority";
            try {
                if(btnElement) btnElement.innerText = "Querying Meteorological Servers...";
                if(document.getElementById('loadingStatus')) document.getElementById('loadingStatus').innerText = "Querying Meteorological Servers...";
                
                const cleanPC = postcode.replace(/\s+/g, '');
                const pcRes = await fetch(`https://api.postcodes.io/postcodes/${cleanPC}`);
                const pcData = await pcRes.json();
                if(pcData.status === 200) {
                    district = pcData.result.admin_district;
                    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pcData.result.latitude}&longitude=${pcData.result.longitude}&current_weather=true&elevation=true`);
                    const weatherData = await weatherRes.json();
                    elevation = `${weatherData.elevation}m`;
                }
            } catch(e) { console.warn("API Fetch bypassed."); }

            // --- 3. EXTREME WEATHER LOAD FACTUALS ---
            const snowLoadKg = Math.round(sqMetres * 65);
            let snowAnalogy = "a heavy motorcycle";
            if(snowLoadKg > 1200) snowAnalogy = "a family estate car";
            else if(snowLoadKg > 800) snowAnalogy = "a compact hatchback car";
            else if(snowLoadKg > 400) snowAnalogy = "a concert grand piano";

            // --- 4. PAMPHLET DATA LOGIC ---
            const p = data.pamphlets || {};
            const docTemplates = [
                { key: p.brochure, icon: '📖', title: 'Product Brochure & Specification Guide' },
                { key: p.warranty, icon: '🛡️', title: '20-Year Insurance Backed Guarantee' },
                { key: p.planning, icon: '🏛️', title: 'Planning Permission & Regulatory Guide' },
                { key: p.sap, icon: '🌿', title: 'SAP Energy Efficiency Factsheet' },
                { key: p.roof, icon: '🏠', title: 'Technical Roofing Specifications' }
            ];
            const activeDocs = docTemplates.filter(d => d.key);

            // =========================================================
            // DYNAMIC TOC GENERATION
            // =========================================================
            let tocHtml = `
                <div class="toc-row"><span class="toc-num">01</span><span class="toc-text">Spatial & Financial Engineering</span></div>
                <div class="toc-row"><span class="toc-num">02</span><span class="toc-text">Architectural Specification & Logistics</span></div>
                <div class="toc-row"><span class="toc-num">03</span><span class="toc-text">Topographical Site Photography</span></div>
            `;
            let sectionCounter = 4;
            if(data.media?.sketch) {
                tocHtml += `<div class="toc-row"><span class="toc-num">0${sectionCounter}</span><span class="toc-text">Calibrated Engineering Overlay</span></div>`;
                sectionCounter++;
            }
            if(activeDocs.length > 0) {
                tocHtml += `<div class="toc-row"><span class="toc-num">0${sectionCounter}</span><span class="toc-text">Document & Regulatory Library</span></div>`;
                sectionCounter++;
            }
            tocHtml += `<div class="toc-row"><span class="toc-num">0${sectionCounter}</span><span class="toc-text">Architectural Glossary of Terms</span></div>`;

            if(btnElement) btnElement.innerText = "Rendering Master PDF...";
            if(document.getElementById('loadingStatus')) document.getElementById('loadingStatus').innerText = "Rendering PDF format...";

            // CRITICAL CORS FIX: Add crossorigin="anonymous" to all Cloudinary images
            const fallbackImg = 'data:image/gif;base64,R0lGODlhAQABAIAAAMLCwgAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==';
            const imgFront = data.media?.front || fallbackImg;
            const imgSide = data.media?.side || fallbackImg;
            const imgRear = data.media?.rear || fallbackImg;
            const imgSketch = data.media?.sketch || fallbackImg;

            // =========================================================
            // PAGE 1: TITLE PAGE & TABLE OF CONTENTS
            // =========================================================
            let html = `
                <div class="pdf-page">
                    <div class="pdf-watermark">${brandName}</div>
                    <div class="pdf-content-wrapper">
                        <div style="text-align: center; margin-top: 40px; margin-bottom: 60px;">
                            <h2 style="font-size: 14px; letter-spacing: 4px; color: #E50914; margin-bottom: 10px;">${brandName}</h2>
                            <h1 style="font-size: 48px; font-weight: 900; margin: 0; line-height: 1.1; text-transform: uppercase;">MASTER SURVEY<br>& FEASIBILITY STUDY</h1>
                            <p style="font-size: 14px; color: #666; margin-top: 15px; letter-spacing: 1px;">STRICTLY CONFIDENTIAL</p>
                        </div>

                        <div style="background: #000; color: #fff; padding: 20px; border-radius: 8px; margin-bottom: 40px; border-left: 5px solid #E50914;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                                <span style="font-size: 11px; text-transform: uppercase; color: #aaa;">Client Reference</span>
                                <span style="font-size: 14px; font-weight: bold;">${data.customerProfile?.leadName || 'Client'}</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                                <span style="font-size: 11px; text-transform: uppercase; color: #aaa;">Site Postcode</span>
                                <span style="font-size: 14px; font-weight: bold;">${postcode}</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                                <span style="font-size: 11px; text-transform: uppercase; color: #aaa;">Document Date</span>
                                <span style="font-size: 14px; font-weight: bold;">${dateStr}</span>
                            </div>
                            <div style="display: flex; justify-content: space-between;">
                                <span style="font-size: 11px; text-transform: uppercase; color: #aaa;">Lead Surveyor</span>
                                <span style="font-size: 14px; font-weight: bold;">Thomas Oldroyd</span>
                            </div>
                        </div>

                        <div class="section-title" style="background: transparent; color: #000; border-bottom: 2px solid #E50914; padding-left: 0; padding-bottom: 5px; margin-bottom: 25px; font-size: 16px;">Document Index</div>
                        ${tocHtml}
                    </div>
                </div>
            `;

            // =========================================================
            // PAGE 2: SPATIAL & FINANCIAL ENGINEERING
            // =========================================================
            html += `
                <div class="pdf-page">
                    <div class="pdf-watermark">${brandName}</div>
                    <div class="pdf-content-wrapper">
                        <div class="pdf-header">
                            <div><div class="pdf-subtitle">SECTION 01</div><h1 class="pdf-title">SPATIAL & FINANCIAL DATA</h1></div>
                        </div>

                        <div class="section-title">1.1 Spatial Footprint & Boundaries</div>
                        <div class="pdf-grid">
                            <div class="pdf-box">
                                <span class="pdf-label">Proposed External Dimensions</span>
                                <p class="pdf-val">${rawSize}</p>
                                <p class="pdf-desc">Millimetric external envelope as verified by lead surveyor.</p>
                            </div>
                            <div class="pdf-box highlight">
                                <span class="pdf-label">Calculated Internal SQM</span>
                                <p class="pdf-val">${sqMetres > 0 ? sqMetres + ' m²' : 'TBC'}</p>
                                <div class="pdf-math">Calculation: ${sizeMatch ? `${parseInt(sizeMatch[1])}mm × ${parseInt(sizeMatch[2])}mm` : 'N/A'}</div>
                            </div>
                            <div class="pdf-box full-width highlight">
                                <span class="pdf-label">${roiTitle}</span>
                                <p class="pdf-val">${roiVal}</p>
                                <p class="pdf-desc">${roiDesc}</p>
                                ${roiMath ? `<div class="pdf-math">${roiMath}</div>` : ''}
                            </div>
                        </div>

                        <div class="section-title">1.2 Topographical & Meteorological Forces</div>
                        <div class="pdf-grid">
                            <div class="pdf-box">
                                <span class="pdf-label">Site Elevation</span>
                                <p class="pdf-val">${elevation} ASL</p>
                                <p class="pdf-desc">Height determines wind exposure profile and cavity tray specifications.</p>
                            </div>
                            <div class="pdf-box">
                                <span class="pdf-label">Local Planning Authority</span>
                                <p class="pdf-val">${district}</p>
                            </div>
                            <div class="pdf-box full-width">
                                <span class="pdf-label">Structural Static Load Capacity</span>
                                <p class="pdf-val">${snowLoadKg > 0 ? snowLoadKg + ' kg Rating' : 'TBC'}</p>
                                <p class="pdf-desc">Based on the ${sqMetres}m² footprint, the ${roofStyle} must be engineered to support ${snowLoadKg}kg of static weight <strong>(Equivalent physical mass of ${snowAnalogy})</strong>.</p>
                                ${sqMetres > 0 ? `<div class="pdf-math">Formula: ${sqMetres}m² × 65kg/m² (UK Extreme Snow Load Index) = ${snowLoadKg}kg</div>` : ''}
                            </div>
                        </div>

                        <div class="pdf-citation">
                            <strong>CITATIONS & METHODOLOGY:</strong><br>
                            [1] Valuation calculations rely on regional average property values sourced from HM Land Registry and ONS indices for Q1/Q2 2026. This is a mathematical projection, not a formal RICS valuation.<br>
                            [2] Meteorological structural load (65kg/m²) is based on BS EN 1991-1-3 Eurocode standards for UK extreme snow loading events. Elevation data provided by live Open-Meteo API integrations for the given postcode boundary.
                        </div>
                    </div>
                </div>
            `;

            // =========================================================
            // PAGE 3: ARCHITECTURAL LOGISTICS
            // =========================================================
            const pDesign = data.designerInsights?.design || '';
            const rawNotes = data.designerInsights?.prep || 'No anomalies recorded. Standard tolerances apply.';
            const dpcDepth = pDesign.includes('DPC Depth:') ? pDesign.split('DPC Depth: ')[1].split('\n')[0] : 'Engineer Verified';
            const baseType = pDesign.includes('Base Type:') ? pDesign.split('Base Type: ')[1].split('\n')[0] : 'Standard Spec';

            html += `
                <div class="pdf-page">
                    <div class="pdf-watermark">${brandName}</div>
                    <div class="pdf-content-wrapper">
                        <div class="pdf-header">
                            <div><div class="pdf-subtitle">SECTION 02</div><h1 class="pdf-title">ARCHITECTURAL LOGISTICS</h1></div>
                        </div>

                        <div class="section-title">2.1 Core Material Specification</div>
                        <div class="pdf-grid">
                            <div class="pdf-box"><span class="pdf-label">Structure Class</span><p class="pdf-val">${buildType}</p></div>
                            <div class="pdf-box"><span class="pdf-label">Roof System</span><p class="pdf-val">${roofStyle}</p></div>
                            <div class="pdf-box"><span class="pdf-label">Existing Masonry</span><p class="pdf-val">${data.projectSpecs?.houseMaterial || 'TBC'}</p></div>
                            <div class="pdf-box"><span class="pdf-label">Frame Spec</span><p class="pdf-val">${data.projectSpecs?.frameColour || 'TBC'}</p></div>
                        </div>

                        <div class="section-title">2.2 Extraction & Site Constraints</div>
                        <div class="pdf-grid">
                            <div class="pdf-box">
                                <span class="pdf-label">DPC Defenses</span>
                                <p class="pdf-val">${dpcDepth}</p>
                            </div>
                            <div class="pdf-box">
                                <span class="pdf-label">Foundation Sub-Base</span>
                                <p class="pdf-val">${baseType}</p>
                            </div>
                            <div class="pdf-box">
                                <span class="pdf-label">Access Width Restrictions</span>
                                <p class="pdf-val">${data.projectSpecs?.accessWidth ? data.projectSpecs.accessWidth + 'mm' : 'Unmeasured'}</p>
                            </div>
                            <div class="pdf-box">
                                <span class="pdf-label">Drainage Routing</span>
                                <p class="pdf-val">${data.logistics?.drainage || 'Survey Verified'}</p>
                            </div>
                            <div class="pdf-box full-width">
                                <span class="pdf-label">Wall Obstacles (Flues / Pipes)</span>
                                <p class="pdf-val">${data.projectSpecs?.wallObstacles || 'Clear Envelope'}</p>
                            </div>
                        </div>

                        <div class="section-title">2.3 Lead Surveyor Field Notes</div>
                        <div class="pdf-box full-width">
                            <p class="pdf-desc" style="white-space: pre-wrap; font-size: 12px; font-style: italic;">"${rawNotes}"</p>
                        </div>
                        
                        <div class="pdf-citation" style="margin-top: 20px; border:none;">
                            <strong>COMPLIANCE STATUS:</strong><br>
                            Building Control: ${data.projectSpecs?.buildingRegs || 'Pending'} | Planning Permission: ${data.projectSpecs?.planningPerms || 'Pending'}
                        </div>
                    </div>
                </div>
            `;

            // =========================================================
            // PAGE 4: VISUAL INTELLIGENCE
            // =========================================================
            html += `
                <div class="pdf-page">
                    <div class="pdf-watermark">${brandName}</div>
                    <div class="pdf-content-wrapper">
                        <div class="pdf-header">
                            <div><div class="pdf-subtitle">SECTION 03</div><h1 class="pdf-title">TOPOGRAPHICAL PHOTOGRAPHY</h1></div>
                        </div>
                        <div class="pdf-image-grid">
                            <div class="pdf-img-container">
                                <div class="pdf-img-title">Front Context</div>
                                <img src="${imgFront}" crossorigin="anonymous">
                            </div>
                            <div class="pdf-img-container">
                                <div class="pdf-img-title">Access Route</div>
                                <img src="${imgSide}" crossorigin="anonymous">
                            </div>
                            <div class="pdf-img-container" style="grid-column: 1 / -1; height: 350px; border: 2px solid #E50914;">
                                <div class="pdf-img-title">Primary Build Footprint</div>
                                <img src="${imgRear}" crossorigin="anonymous">
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // =========================================================
            // PAGE 5: SNIPER SKETCH (If it exists)
            // =========================================================
            if(data.media?.sketch) {
                html += `
                <div class="pdf-page">
                    <div class="pdf-watermark">${brandName}</div>
                    <div class="pdf-content-wrapper">
                        <div class="pdf-header">
                            <div><div class="pdf-subtitle">SECTION 04</div><h1 class="pdf-title">ENGINEERING CALIBRATION OVERLAY</h1></div>
                        </div>
                        <p style="font-size: 12px; color: #333; margin-bottom: 15px;"><strong>Note for manufacturing teams:</strong> The following spatial markings denote critical millimeter tolerances established by the lead surveyor on site.</p>
                        <div class="pdf-img-container" style="height: 600px; border: 3px solid #E50914;">
                            <img src="${imgSketch}" crossorigin="anonymous">
                        </div>
                    </div>
                </div>`;
            }

            // =========================================================
            // PAGE 6+: DOCUMENT LIBRARY (Pamphlet Placeholders)
            // =========================================================
            activeDocs.forEach((doc, index) => {
                html += `
                <div class="pdf-page">
                    <div class="pdf-watermark">${brandName}</div>
                    <div class="pdf-content-wrapper" style="padding-bottom: 0;">
                        <div class="pamphlet-cover">
                            <div class="pamphlet-icon">${doc.icon}</div>
                            <h2 class="pamphlet-title">${doc.title}</h2>
                            <p style="color: #666; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;">Official Document Appendix</p>
                            <div style="margin-top: 50px; border-top: 2px solid #E50914; padding-top: 20px; width: 50%;">
                                <p style="font-size: 10px; color: #888;">Prepared by ${brandName}</p>
                            </div>
                        </div>
                    </div>
                </div>`;
            });

            // =========================================================
            // FINAL PAGE: GLOSSARY OF TERMS
            // =========================================================
            html += `
                <div class="pdf-page">
                    <div class="pdf-watermark">${brandName}</div>
                    <div class="pdf-content-wrapper">
                        <div class="pdf-header">
                            <div><div class="pdf-subtitle">APPENDIX</div><h1 class="pdf-title">ARCHITECTURAL GLOSSARY</h1></div>
                        </div>
                        <div style="margin-top: 20px;">
                            <div class="glossary-item"><span class="glossary-term">DPC (Damp Proof Course)</span><p class="glossary-def">A horizontal structural barrier in a wall designed to resist moisture rising through the structure by capillary action.</p></div>
                            <div class="glossary-item"><span class="glossary-term">Elevation</span><p class="glossary-def">An architectural drawing or photograph showing a specific external face of the property (Front, Side, or Rear).</p></div>
                            <div class="glossary-item"><span class="glossary-term">Fascia</span><p class="glossary-def">The horizontal architectural board fitted along the lower edge of the roof, carrying the guttering and supporting the eaves.</p></div>
                            <div class="glossary-item"><span class="glossary-term">Footprint</span><p class="glossary-def">The entire area of ground covered by the proposed extension or structure, calculated in square meters.</p></div>
                            <div class="glossary-item"><span class="glossary-term">NCS Prior Approval</span><p class="glossary-def">Neighborhood Consultation Scheme. A fast-track planning process allowing homeowners to build larger extensions without full planning permission, subject to neighbor consultation.</p></div>
                            <div class="glossary-item"><span class="glossary-term">SAP Calculations</span><p class="glossary-def">Standard Assessment Procedure. The UK Government's recommended method system for measuring the energy rating and thermal efficiency of residential dwellings.</p></div>
                            <div class="glossary-item"><span class="glossary-term">U-Value</span><p class="glossary-def">A measure of thermal transmittance. It indicates how effective a material is as an insulator. The lower the U-Value, the better the insulation.</p></div>
                        </div>
                    </div>
                </div>
            `;

            pdfContent.innerHTML = html;

            // =========================================================
            // GENERATE PDF (CRASH-PROOFED)
            // =========================================================
            const element = document.getElementById('pdf-content');
            
            // OPTIMIZED OPTIONS: Dropped scale from 2 to 1.5, slightly compressed JPEG to protect mobile RAM
            const opt = {
                margin:       0,
                filename:     `COHI_Survey_${data.customerProfile?.leadName || 'Client'}.pdf`,
                image:        { type: 'jpeg', quality: 0.85 },
                html2canvas:  { scale: 1.5, useCORS: true, allowTaint: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // Un-hide the DOM so html2canvas can read it
            document.getElementById('pdf-engine').style.display = 'block';
            
            // CRITICAL FIX: The browser needs a tiny fraction of a second to physically "paint" the images 
            // onto the hidden DOM before the PDF captures it. If we don't wait, it captures blank space or crashes.
            await new Promise(resolve => setTimeout(resolve, 500));
            
            try {
                await html2pdf().set(opt).from(element).save();
            } catch (err) {
                alert("PDF Generation Failed. Your device memory may be full: " + err.message);
            } finally {
                // Re-hide the DOM and reset buttons
                document.getElementById('pdf-engine').style.display = 'none';
                if (btnElement) {
                    btnElement.innerText = originalText;
                    btnElement.disabled = false;
                }
            }
        };

        // Initialize the compiler
        loadCompiler();
    </script>
</body>
</html>
