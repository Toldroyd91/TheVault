<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Control | Gatekeeper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0d1117; color: white; font-family: system-ui, sans-serif; }
        .glass-panel { background: rgba(22, 27, 34, 0.8); border: 1px solid #30363d; border-radius: 12px; }
        .input-luxe { background: #090d13; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 8px; width: 100%; outline: none; }
        .input-luxe:focus { border-color: #0dcaf0; }
        .switch-unlocked { background: #238636 !important; box-shadow: 0 0 20px rgba(35, 134, 54, 0.4); }
    </style>
</head>
<body class="p-8 flex justify-center">

    <div class="w-full max-w-2xl space-y-6">
        <div class="flex justify-between items-center border-b border-[#30363d] pb-4">
            <h1 class="text-2xl font-black text-[#0dcaf0] tracking-widest uppercase">Project Gatekeeper</h1>
            <div id="statusBadge" class="px-3 py-1 bg-yellow-500/20 text-yellow-500 border border-yellow-500 rounded text-xs font-bold uppercase tracking-widest">Status: Tease Mode</div>
        </div>

        <!-- UDESIGN UPLOAD SECTION -->
        <div class="glass-panel p-6 shadow-xl">
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4 border-b border-[#30363d] pb-2">1. Push UDesign Assets to Vault</h2>
            
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div><label class="text-[10px] text-gray-500 uppercase tracking-widest">Contract Total (£)</label>
                <input type="text" id="priceTotal" class="input-luxe font-mono text-lg text-[#0dcaf0]" placeholder="19724.00" value="19724.00"></div>
                <div><label class="text-[10px] text-gray-500 uppercase tracking-widest">Required Deposit (£)</label>
                <input type="text" id="priceDeposit" class="input-luxe font-mono text-lg text-[#0dcaf0]" placeholder="2959.00" value="2959.00"></div>
            </div>

            <div class="mb-4">
                <label class="text-[10px] text-gray-500 uppercase tracking-widest mb-2 block">Upload UDesign 3D Renders</label>
                <input type="file" id="uploadRenders" multiple accept="image/*" class="input-luxe text-sm">
            </div>

            <button id="btnPushDesign" class="w-full py-3 bg-gray-800 hover:bg-gray-700 text-white font-bold uppercase tracking-widest rounded-lg transition border border-[#30363d]">
                Lock In Designs & Price
            </button>
        </div>

        <!-- THE SALES SWITCH -->
        <div class="glass-panel p-6 shadow-xl text-center mt-8 border-t-4 border-[#E50914]" id="switchContainer">
            <h2 class="text-lg font-black text-white uppercase tracking-widest mb-2">Live Customer Vault Access</h2>
            <p class="text-xs text-gray-400 mb-6">Flicking this switch instantly unlocks the financial breakdown and contract on the customer's device.</p>
            
            <button id="btnToggleAccess" class="w-full py-6 bg-[#E50914] text-white font-black text-xl uppercase tracking-widest rounded-xl transition shadow-[0_0_20px_rgba(229,9,20,0.3)]">
                🔓 GRANT FULL ACCESS
            </button>
        </div>
    </div>

    <script type="module">
        import { db, doc, updateDoc, onSnapshot, arrayUnion } from './js/core-firebase.js';
        
        const projectId = new URLSearchParams(window.location.search).get('id');
        const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dqkhhz0f9/image/upload"; 
        let currentAccess = 'design_tease';

        if(!projectId) alert("No Project ID found in URL.");

        // Listen to live database state
        onSnapshot(doc(db, "surveys", projectId), (snap) => {
            const data = snap.data();
            currentAccess = data.vaultAccessLevel || 'design_tease';
            
            const badge = document.getElementById('statusBadge');
            const btn = document.getElementById('btnToggleAccess');
            
            if(currentAccess === 'full_access') {
                badge.className = "px-3 py-1 bg-green-500/20 text-green-500 border border-green-500 rounded text-xs font-bold uppercase tracking-widest";
                badge.innerText = "Status: Fully Unlocked";
                btn.classList.replace('bg-[#E50914]', 'switch-unlocked');
                btn.innerText = "🔒 REVOKE ACCESS (HIDE PRICE)";
            } else {
                badge.className = "px-3 py-1 bg-yellow-500/20 text-yellow-500 border border-yellow-500 rounded text-xs font-bold uppercase tracking-widest";
                badge.innerText = "Status: Tease Mode (Price Hidden)";
                btn.classList.remove('switch-unlocked');
                btn.classList.add('bg-[#E50914]');
                btn.innerText = "🔓 GRANT FULL ACCESS";
            }
        });

        // Toggle Switch Logic
        document.getElementById('btnToggleAccess').addEventListener('click', async () => {
            const newState = currentAccess === 'full_access' ? 'design_tease' : 'full_access';
            await updateDoc(doc(db, "surveys", projectId), { vaultAccessLevel: newState });
        });

        // Handle UDesign Uploads
        document.getElementById('btnPushDesign').addEventListener('click', async () => {
            const btn = document.getElementById('btnPushDesign');
            const files = document.getElementById('uploadRenders').files;
            btn.innerText = "Uploading Assets..."; btn.disabled = true;

            const urls = [];
            for(let i=0; i<files.length; i++) {
                const fd = new FormData(); fd.append('file', files[i]); fd.append('upload_preset', 'crm_document_uploads');
                const res = await fetch(CLOUDINARY_URL, {method: 'POST', body: fd});
                const json = await res.json();
                if(json.secure_url) urls.push(json.secure_url);
            }

            await updateDoc(doc(db, "surveys", projectId), {
                "uDesignData.totalPrice": document.getElementById('priceTotal').value,
                "uDesignData.deposit": document.getElementById('priceDeposit').value,
                "uDesignData.renders": urls.length > 0 ? urls : null,
                "vaultAccessLevel": "design_tease" // Pushing designs sets it to tease mode automatically
            });

            btn.innerText = "Lock In Designs & Price"; btn.disabled = false;
            alert("UDesign data pushed to Customer Vault.");
        });
    </script>
</body>
</html>
